<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Kids Arcade</title>
  <link rel="stylesheet" href="css/style.css?v=202611020331">
  <link rel="stylesheet" href="arcade/shared.css?v=202611020331">
  <style>
    /* The arcade hub: a dark arcade room, the Kids Arcade logo, and a game box for each game */
    html, body { height: auto; min-height: 100%; overflow-x: hidden; overflow-y: auto; }
    html { background: #150e38; }   /* the hub scrolls (the games don't) */
    body {
      color: #fff; min-height: 100%;
      background:
        radial-gradient(circle at 12% 18%, rgba(255,95,162,0.25) 0, transparent 22%),
        radial-gradient(circle at 88% 30%, rgba(76,201,240,0.25) 0, transparent 22%),
        radial-gradient(circle at 50% 0%, #4d3aa6 0, #2a1e66 45%, #150e38 100%);
      background-attachment: fixed;
    }
    /* twinkly dots on the walls */
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none; opacity: 0.5;
      background-image: radial-gradient(#fff 1.2px, transparent 1.5px), radial-gradient(#ffd166 1.2px, transparent 1.5px);
      background-size: 90px 90px, 130px 130px; background-position: 10px 20px, 60px 70px;
    }
    header { text-align: center; padding: 44px 16px 0; }
    header .ar-logo { width: min(520px, 92vw); margin: 0 auto; }
    .neon-line { height: 6px; max-width: 1180px; margin: 0 auto 6px; border-radius: 3px; background: linear-gradient(90deg, #ff5fa2, #ffd166, #06d6a0, #4cc9f0, #9b5de5);
      box-shadow: 0 0 18px rgba(255,209,102,0.6); }

    /* cards wrap 3 across (2 on tablets, 1 on phones); a short last row sits in the middle */
    .grid {
      --gap: 26px; --cols: 3;
      display: flex; flex-wrap: wrap; justify-content: center; gap: var(--gap);
      padding: 16px; max-width: 1180px; margin: 0 auto 40px; position: relative;
    }
    .grid > .card { width: calc((100% - (var(--cols) - 1) * var(--gap)) / var(--cols)); }
    @media (max-width: 900px) { .grid { --cols: 2; --gap: 18px; } }
    @media (max-width: 560px) { .grid { --cols: 1; } }

    /* one game box */
    .card {
      position: relative; display: flex; flex-direction: column; overflow: hidden;
      border: 6px solid var(--ink); border-radius: 28px; background: #241a5a;
      box-shadow: 0 10px 0 rgba(0,0,0,0.4), 0 0 0 4px rgba(255,255,255,0.08);
      text-decoration: none; color: #fff; transition: transform 0.15s, box-shadow 0.15s;
    }
    .card:hover { transform: translateY(-6px) rotate(-0.8deg); box-shadow: 0 16px 0 rgba(0,0,0,0.4), 0 0 30px 6px var(--c); }
    .card:active { transform: translateY(6px); box-shadow: 0 3px 0 rgba(0,0,0,0.4); }
    .card .art {
      position: relative; height: 196px; overflow: hidden; display: grid; place-items: center;
      background: radial-gradient(circle at 50% 50%, var(--c2) 0, var(--c) 70%);
      border-bottom: 6px solid var(--ink);
    }
    /* spinning light rays behind the badge */
    .card .rays { position: absolute; width: 200%; aspect-ratio: 1; left: -50%; top: 50%; translate: 0 -50%;
      background: repeating-conic-gradient(rgba(255,255,255,0.28) 0 9deg, transparent 9deg 18deg);
      animation: hubspin 40s linear infinite; }
    .card:hover .rays { animation-duration: 8s; }
    @keyframes hubspin { to { rotate: 360deg; } }
    .card .badge {
      position: relative; width: 158px; height: 158px; border-radius: 50%; overflow: hidden;
      border: 6px solid var(--ink); background: #fff;
      box-shadow: 0 0 0 6px #fff, 0 0 0 11px var(--ink), 0 10px 0 11px rgba(0,0,0,0.25);
      transition: transform 0.2s;
    }
    .card .badge svg { width: 100%; height: 100%; display: block; }
    .card:hover .badge { transform: scale(1.07) rotate(-4deg); }
    .card .body { padding: 12px 18px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1;
      background: linear-gradient(#2e2270, #1f1650); }
    .card h2 {
      margin: 0; font-family: 'Lilita One', 'Arial Rounded MT Bold', 'Arial Black', sans-serif; font-weight: 400;
      font-size: 30px; letter-spacing: 1px; color: var(--c2); line-height: 1.05;
      text-shadow: 3px 3px 0 #2b2b2b, -2px -2px 0 #2b2b2b, 2px -2px 0 #2b2b2b, -2px 2px 0 #2b2b2b, 0 3px 0 #2b2b2b;
    }
    .card p { margin: 0; font-size: 16px; color: #d9d3ff; flex: 1; }
    .card .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; }
    .card .play {
      display: inline-flex; align-items: center; gap: 8px; color: var(--ink);
      background: var(--ar-green); border: 4px solid var(--ink); border-radius: 999px;
      padding: 8px 22px; font-family: 'Lilita One', 'Arial Black', sans-serif; font-size: 22px; letter-spacing: 1px;
      box-shadow: 0 5px 0 rgba(0,0,0,0.35);
    }
    .card:hover .play { background: #ffd166; }
    .card .play svg { width: 22px; height: 22px; }
    .progress { display: flex; align-items: center; gap: 4px; font-weight: 800; font-size: 16px; color: #fff;
      background: rgba(255,255,255,0.1); border-radius: 999px; padding: 2px 10px; }
    .progress:empty { display: none; }
    .progress svg { width: 24px; height: 24px; }
    .card .num {
      position: absolute; top: 10px; left: 10px; z-index: 2; width: 40px; height: 40px; border-radius: 50%;
      background: #ffd166; border: 4px solid var(--ink); color: var(--ink);
      display: grid; place-items: center; font-family: 'Lilita One', 'Arial Black', sans-serif; font-size: 20px;
    }
    @media (prefers-reduced-motion: reduce) { .card, .card:hover { transform: none; } .card .rays { animation: none; } }
  </style>
</head>
<body>
  <header id="head"></header>
  <div class="neon-line"></div>

  <main class="grid" id="grid"></main>

  <script src="arcade/shared.js?v=202611020331"></script>
  <script src="arcade/badges.js?v=202611020331"></script>
  <script>
    // The games. Each card: picture, name, one line, Play, and progress.
    // "dir" is the game's folder; "id" is its save name (see arcade/shared.js).
    const INK = 'stroke="#2b2b2b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"';
    const GAMES = [
      { id: 'bike', dir: 'bike', name: 'Turbo Bike', color: '#8ecae6',
        text: 'Race your dirt bike over big jumps. Don\'t overheat!',
        art: `<path d="M0 120 L60 120 L110 80 L130 80 L130 160 L0 160 Z" fill="#c68b59" ${INK}/>
              <path d="M130 120 H240 V160 H130 Z" fill="#c68b59" ${INK}/>
              <g class="wobble"><g transform="translate(150 50) rotate(-12)">
                <circle cx="0" cy="40" r="16" fill="#fff" ${INK}/><circle cx="56" cy="40" r="16" fill="#fff" ${INK}/>
                <path d="M0 40 L20 18 H44 L56 40 M20 18 L30 40 H44" fill="none" ${INK}/>
                <path d="M14 18 H50 L44 6 H20 Z" fill="#ef476f" ${INK}/>
                <circle cx="34" cy="-8" r="11" fill="#ffd166" ${INK}/></g></g>`},
      { id: 'rc', dir: 'rc', name: 'Mini RC Racers', color: '#90be6d',
        text: 'Zoom around twisty tracks against three racers.',
        art: `<path d="M20 30 H220 A30 30 0 0 1 220 120 H20 A30 30 0 0 1 20 30 Z" fill="#8d99ae" ${INK}/>
              <path d="M40 60 H200 A15 15 0 0 1 200 90 H40 A15 15 0 0 1 40 60 Z" fill="#90be6d" ${INK}/>
              <g class="wobble"><rect x="70" y="32" width="44" height="24" rx="8" fill="#ef476f" ${INK}/><rect x="140" y="96" width="44" height="24" rx="8" fill="#118ab2" ${INK}/></g>`},
      { id: 'hoops', dir: 'hoops', name: 'Hoop Heroes', color: '#ffb4a2',
        text: 'Pop-a-shot! Pull back, shoot, catch fire and beat your rival.',
        art: `<rect x="150" y="14" width="70" height="56" rx="6" fill="#fff" ${INK}/><rect x="170" y="34" width="30" height="22" fill="none" ${INK}/>
              <path d="M150 70 H200 L192 108 H158 Z" fill="#fff" ${INK}/><path d="M150 70 H200" stroke="#ef476f" stroke-width="7"/>
              <g class="wobble"><circle cx="70" cy="90" r="28" fill="#ff8c42" ${INK}/><path d="M42 90 H98 M70 62 V118 M50 70 Q70 90 50 110 M90 70 Q70 90 90 110" fill="none" ${INK} stroke-width="3"/></g>`},
      { id: 'archery', dir: 'archery', name: 'Bullseye Adventure', color: '#b8e0d2',
        text: 'Pull back, aim and pop the targets and balloons.',
        art: `<g class="wobble"><circle cx="170" cy="80" r="52" fill="#fff" ${INK}/><circle cx="170" cy="80" r="38" fill="#ef476f" ${INK}/><circle cx="170" cy="80" r="24" fill="#fff" ${INK}/><circle cx="170" cy="80" r="10" fill="#ffd166" ${INK}/></g>
              <path d="M30 86 L168 80" ${INK} fill="none"/><path d="M168 80 L150 72 L152 88 Z" fill="#2b2b2b"/><path d="M30 86 L18 76 M30 86 L18 96" ${INK} fill="none"/>
              <ellipse cx="60" cy="40" rx="16" ry="20" fill="#9b5de5" ${INK}/><path d="M60 60 Q56 70 62 80" fill="none" ${INK} stroke-width="2"/>`},
      { id: 'jungle', dir: 'jungle', name: 'Jungle Jump', color: '#a0e7a0',
        text: 'Glide with a leaf, roll and bounce through four worlds.',
        art: `<rect x="0" y="122" width="240" height="38" fill="#b9783f" ${INK}/><rect x="0" y="122" width="240" height="9" fill="#6cc04a"/>
              <path d="M150 122 Q146 96 168 98 Q190 96 186 122 Z" fill="#a8a29e" ${INK}/>
              <g transform="translate(196 22)"><ellipse cx="0" cy="22" rx="20" ry="24" fill="#ef476f" ${INK}/><path d="M-8 0 V44 M8 0 V44" stroke="#ffd166" stroke-width="5"/><ellipse cx="0" cy="22" rx="20" ry="24" fill="none" ${INK}/><rect x="-10" y="52" width="20" height="14" rx="3" fill="#c68b59" ${INK}/></g>
              <g class="wobble"><path d="M44 46 Q70 18 96 46 Q70 38 44 46 Z" fill="#6cc04a" ${INK}/><path d="M70 40 V60" stroke="#2b2b2b" stroke-width="3"/>
              <circle cx="56" cy="74" r="7" fill="#b5764a" ${INK} stroke-width="3"/><circle cx="84" cy="74" r="7" fill="#b5764a" ${INK} stroke-width="3"/>
              <circle cx="70" cy="80" r="17" fill="#b5764a" ${INK}/><ellipse cx="72" cy="84" rx="10" ry="8" fill="#f5d3a6"/><circle cx="66" cy="78" r="2.5" fill="#2b2b2b"/><circle cx="76" cy="78" r="2.5" fill="#2b2b2b"/></g>`},
      { id: 'trail', dir: 'trail', name: 'Treasure Trail', color: '#7bd389',
        text: 'Swing on vines, hop on hippos and find hidden treasure.',
        art: `<rect x="0" y="110" width="90" height="50" fill="#b9783f" ${INK}/><rect x="0" y="110" width="90" height="10" fill="#6cc04a"/>
              <rect x="90" y="124" width="70" height="36" fill="#3aa7e0"/><rect x="160" y="110" width="80" height="50" fill="#b9783f" ${INK}/><rect x="160" y="110" width="80" height="10" fill="#6cc04a"/>
              <ellipse cx="125" cy="128" rx="24" ry="12" fill="#9a8fbf" ${INK}/>
              <path d="M150 0 L112 70" ${INK} stroke-width="8" fill="none"/><path d="M150 0 L112 70" stroke="#4caf50" stroke-width="4"/>
              <g class="wobble"><circle cx="110" cy="62" r="12" fill="#f2c9a0" ${INK}/><path d="M94 56 Q110 38 126 56 Z" fill="#e9c46a" ${INK}/></g>
              <path d="M196 96 L204 84 L212 96 L204 108 Z" fill="#ef476f" ${INK}/>`},
      { id: 'space', dir: 'space', name: 'Space Defender', color: '#3d348b',
        text: 'Fly your ship and bubble-zap the silly space robots.',
        art: `<circle cx="30" cy="30" r="3" fill="#fff"/><circle cx="200" cy="20" r="3" fill="#fff"/><circle cx="120" cy="50" r="2" fill="#fff"/><circle cx="220" cy="90" r="2" fill="#fff"/>
              <g class="wobble"><ellipse cx="170" cy="50" rx="32" ry="14" fill="#06d6a0" ${INK}/><path d="M152 46 A18 18 0 0 1 188 46" fill="#bde0fe" ${INK}/><circle cx="170" cy="40" r="5" fill="#2b2b2b"/></g>
              <path d="M70 140 L90 96 L110 140 Z" fill="#ffd166" ${INK}/><rect x="84" y="112" width="12" height="10" rx="3" fill="#118ab2"/>
              <rect x="86" y="70" width="8" height="16" rx="4" fill="#f15bb5"/>`},
      { id: 'abc', dir: 'abc', name: 'Bubble School', color: '#4cc9f0',
        text: 'Pop the right bubble: counting, letters and easy math.',
        art: `<rect x="0" y="130" width="240" height="30" fill="#f4d58d" ${INK}/>
              <g class="wobble"><circle cx="60" cy="56" r="30" fill="#bde0fe" ${INK}/><text x="60" y="70" font-size="38" font-weight="900" text-anchor="middle" fill="#2b2b2b" font-family="sans-serif">A</text>
              <circle cx="180" cy="48" r="26" fill="#bde0fe" ${INK}/><text x="180" y="61" font-size="34" font-weight="900" text-anchor="middle" fill="#2b2b2b" font-family="sans-serif">3</text></g>
              <ellipse cx="120" cy="108" rx="30" ry="26" fill="#c77dff" ${INK}/><circle cx="110" cy="104" r="4" fill="#2b2b2b"/><circle cx="130" cy="104" r="4" fill="#2b2b2b"/>
              <path d="M112 116 Q120 122 128 116" fill="none" ${INK} stroke-width="3"/><path d="M98 84 L120 74 L142 84 L120 92 Z" fill="#2b2b2b"/>`},
      { id: 'coloring', dir: 'coloring', name: 'Magic Coloring Book', color: '#ffd166',
        text: 'Fill pictures, paint with brushes and add stickers.',
        art: `<path d="M120 20 C180 20 215 50 210 90 C206 115 180 115 165 108 C150 101 140 112 148 128 C155 148 140 155 120 152 C60 145 30 115 32 82 C35 45 70 20 120 20 Z" fill="#fff" ${INK}/>
              <g class="wobble"><circle cx="85" cy="60" r="12" fill="#ef476f" ${INK}/><circle cx="125" cy="48" r="12" fill="#06d6a0" ${INK}/><circle cx="165" cy="65" r="12" fill="#118ab2" ${INK}/><circle cx="75" cy="102" r="12" fill="#9b5de5" ${INK}/></g>`},
      { id: 'maze', dir: 'maze', name: 'Maze Explorer', color: '#8ecae6',
        text: 'Guide a friend through shape mazes to a treat.',
        art: `<rect x="60" y="14" width="124" height="124" rx="16" fill="#fff" ${INK}/>
              <path d="M60 50 H150 M94 84 H184 M60 116 H140" ${INK} stroke-width="7" fill="none"/>
              <g class="wobble"><circle cx="76" cy="32" r="10" fill="#ffd166" ${INK}/></g>
              <path d="M164 104 l5 10 l11 1 l-8 7 l2 11 l-10 -5 l-10 5 l2 -11 l-8 -7 l11 -1 z" fill="#ef476f" ${INK} stroke-width="3"/>`},
      { id: 'fishing', dir: 'fishing', name: 'Fishing Frenzy', color: '#4cc9f0',
        text: 'Cast, wait for a nibble, and reel in rare fish.',
        art: `<path d="M0 60 Q30 50 60 60 T120 60 T180 60 T240 60 V160 H0 Z" fill="#3a86ff" ${INK}/>
              <path d="M30 0 Q80 10 120 70" fill="none" stroke="#2b2b2b" stroke-width="2"/><circle cx="120" cy="66" r="7" fill="#ef476f" ${INK} stroke-width="3"/>
              <g class="wobble"><path d="M140 110 C160 90 190 92 200 110 C190 128 160 130 140 110 Z M140 110 L124 98 L126 122 Z" fill="#ffd166" ${INK}/><circle cx="186" cy="106" r="3" fill="#2b2b2b"/></g>`},
    ];

    // the big Kids Arcade logo (same style as the games' title screens)
    document.getElementById('head').innerHTML = `<div class="ar-logo">${Arcade.logo({ title: 'Kids Arcade', colors: ['#ffd166', '#ff5fa2'], badge: Arcade.badges.arcade })}</div>`;

    const grid = document.getElementById('grid');
    const playIcon = Arcade.icons.play;
    GAMES.forEach((game, i) => {
      const s = Arcade.summary(game.id);
      let prog = '';
      if (s.gold || s.silver || s.bronze) {
        const best = s.gold ? 'gold' : s.silver ? 'silver' : 'bronze';
        prog += Arcade.icons.medal(best) + (s.gold + s.silver + s.bronze);
      }
      if (s.stars) prog += Arcade.icons.star(true) + s.stars;
      const card = document.createElement('a');
      card.className = 'card';
      card.href = game.dir + '/index.html';
      card.style.setProperty('--c', game.color);
      // a lighter version of the color for the name and glow (extra light if the color is dark)
      const n = parseInt(game.color.slice(1), 16), light = ((n >> 16) * 0.3 + ((n >> 8) & 255) * 0.59 + (n & 255) * 0.11) / 255;
      card.style.setProperty('--c2', Arcade.mixWhite(game.color, light < 0.4 ? 0.8 : 0.6));
      card.setAttribute('aria-label', game.name);
      card.innerHTML = `
        <div class="art"><div class="rays"></div><div class="badge"><svg viewBox="0 0 240 240">${Arcade.badges[game.id] || ''}</svg></div></div>
        <div class="num">${i + 1}</div>
        <div class="body">
          <h2>${game.name}</h2>
          <p>${game.text}</p>
          <div class="foot">
            <span class="play">${playIcon}Play</span>
            <span class="progress">${prog}</span>
          </div>
        </div>`;
      card.addEventListener('pointerenter', () => Arcade.sfx('tick'));
      card.addEventListener('click', (e) => {
        // a happy blip, then go (short delay so the sound is heard)
        e.preventDefault();
        Arcade.audio.resume();
        Arcade.sfx('coin');
        setTimeout(() => { location.href = card.href; }, 160);
      });
      grid.appendChild(card);
    });
  </script>
</body>
</html>

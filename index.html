<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <!-- a real app: Add to Home Screen, full screen, works offline (see sw.js) -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#2a1e66">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kids Arcade">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Kids Arcade</title>
  <link rel="stylesheet" href="css/style.css?v=202611130443">
  <link rel="stylesheet" href="arcade/shared.css?v=202611130443">
  <style>
    /* The arcade hub: a dark arcade room, the Kids Arcade logo, and a game box for each game */
    html, body { height: auto; min-height: 100%; overflow-x: hidden; overflow-y: auto; }
    html { background: #150e38; }   /* the hub scrolls (the games don't) */
    body {
      color: #fff; min-height: 100%;
      background:
        radial-gradient(circle at 12% 18%, rgba(255,95,162,0.25) 0, transparent 22%),
        radial-gradient(circle at 88% 30%, rgba(76,201,240,0.25) 0, transparent 22%),
        radial-gradient(circle at 50% 0%, #4d3aa6 0, #2a1e66 45%, #150e38 100%);
      background-attachment: fixed;
    }
    /* twinkly dots on the walls */
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none; opacity: 0.5;
      background-image: radial-gradient(#fff 1.2px, transparent 1.5px), radial-gradient(#ffd166 1.2px, transparent 1.5px);
      background-size: 90px 90px, 130px 130px; background-position: 10px 20px, 60px 70px;
    }
    header { text-align: center; padding: 44px 16px 0; }
    header .ar-logo { width: min(520px, 92vw); margin: 0 auto; }
    .neon-line { height: 6px; max-width: 1180px; margin: 0 auto 6px; border-radius: 3px; background: linear-gradient(90deg, #ff5fa2, #ffd166, #06d6a0, #4cc9f0, #9b5de5);
      box-shadow: 0 0 18px rgba(255,209,102,0.6); }

    /* cards wrap 3 across (2 on tablets, 1 on phones); a short last row sits in the middle */
    .grid {
      --gap: 26px; --cols: 3;
      display: flex; flex-wrap: wrap; justify-content: center; gap: var(--gap);
      padding: 16px; max-width: 1180px; margin: 0 auto 40px; position: relative;
    }
    .grid > .card { width: calc((100% - (var(--cols) - 1) * var(--gap)) / var(--cols)); }
    @media (max-width: 900px) { .grid { --cols: 2; --gap: 18px; } }

    /* one game box */
    .card {
      position: relative; display: flex; flex-direction: column; overflow: hidden;
      border: 6px solid var(--ink); border-radius: 28px; background: #241a5a;
      box-shadow: 0 10px 0 rgba(0,0,0,0.4), 0 0 0 4px rgba(255,255,255,0.08);
      text-decoration: none; color: #fff; transition: transform 0.15s, box-shadow 0.15s;
    }
    .card:hover { transform: translateY(-6px) rotate(-0.8deg); box-shadow: 0 16px 0 rgba(0,0,0,0.4), 0 0 30px 6px var(--c); }
    .card:active { transform: translateY(6px); box-shadow: 0 3px 0 rgba(0,0,0,0.4); }
    .card .art {
      position: relative; height: 196px; overflow: hidden; display: grid; place-items: center;
      background: radial-gradient(circle at 50% 50%, var(--c2) 0, var(--c) 70%);
      border-bottom: 6px solid var(--ink);
    }
    /* spinning light rays behind the badge */
    .card .rays { position: absolute; width: 200%; aspect-ratio: 1; left: -50%; top: 50%; translate: 0 -50%;
      background: repeating-conic-gradient(rgba(255,255,255,0.28) 0 9deg, transparent 9deg 18deg);
      animation: hubspin 40s linear infinite; }
    .card:hover .rays { animation-duration: 8s; }
    @keyframes hubspin { to { rotate: 360deg; } }
    .card .badge {
      position: relative; width: 158px; height: 158px; border-radius: 50%; overflow: hidden;
      border: 6px solid var(--ink); background: #fff;
      box-shadow: 0 0 0 6px #fff, 0 0 0 11px var(--ink), 0 10px 0 11px rgba(0,0,0,0.25);
      transition: transform 0.2s;
    }
    .card .badge svg { width: 100%; height: 100%; display: block; }
    .card:hover .badge { transform: scale(1.07) rotate(-4deg); }
    .card .body { padding: 12px 18px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1;
      background: linear-gradient(#2e2270, #1f1650); }
    .card h2 {
      margin: 0; font-family: 'Lilita One', 'Arial Rounded MT Bold', 'Arial Black', sans-serif; font-weight: 400;
      font-size: 30px; letter-spacing: 1px; color: var(--c2); line-height: 1.05;
      text-shadow: 3px 3px 0 #2b2b2b, -2px -2px 0 #2b2b2b, 2px -2px 0 #2b2b2b, -2px 2px 0 #2b2b2b, 0 3px 0 #2b2b2b;
    }
    .card p { margin: 0; font-size: 16px; color: #d9d3ff; flex: 1; }
    .card .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; }
    .card .play {
      display: inline-flex; align-items: center; gap: 8px; color: var(--ink);
      background: var(--ar-green); border: 4px solid var(--ink); border-radius: 999px;
      padding: 8px 22px; font-family: 'Lilita One', 'Arial Black', sans-serif; font-size: 22px; letter-spacing: 1px;
      box-shadow: 0 5px 0 rgba(0,0,0,0.35);
    }
    .card:hover .play { background: #ffd166; }
    .card .play svg { width: 22px; height: 22px; }
    .progress { display: flex; align-items: center; gap: 4px; font-weight: 800; font-size: 16px; color: #fff;
      background: rgba(255,255,255,0.1); border-radius: 999px; padding: 2px 10px; }
    .progress:empty { display: none; }
    .progress svg { width: 24px; height: 24px; }
    .card .num {
      position: absolute; top: 10px; left: 10px; z-index: 2; width: 40px; height: 40px; border-radius: 50%;
      background: #ffd166; border: 4px solid var(--ink); color: var(--ink);
      display: grid; place-items: center; font-family: 'Lilita One', 'Arial Black', sans-serif; font-size: 20px;
    }
    @media (prefers-reduced-motion: reduce) { .card, .card:hover { transform: none; } .card .rays { animation: none; } }
    /* ---------- players: "who's playing" button, picker and editor ---------- */
    .who {
      display: inline-flex; align-items: center; gap: 10px; margin: 10px auto 14px; cursor: pointer;
      background: #fff; color: var(--ink); border: 5px solid var(--ink); border-radius: 999px;
      padding: 5px 18px 5px 5px; min-height: 72px; font: inherit; font-weight: 900; font-size: 22px;
      box-shadow: 0 6px 0 rgba(0,0,0,0.35); -webkit-tap-highlight-color: transparent;
    }
    .who:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.35); }
    .who .av { width: 58px; height: 58px; border: 4px solid var(--ink); border-radius: 50%; overflow: hidden; flex: none; }
    .who .av svg, .pl-tile .av svg, .pl-big svg { width: 100%; height: 100%; display: block; }
    .who > svg { width: 34px; height: 34px; flex: none; }   /* the swap arrows */
    .who .nm { flex: none; max-width: 46vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .who .nm:empty { display: none; }
    .toprow { display: flex; justify-content: center; align-items: center; gap: 12px; flex-wrap: wrap; padding: 0 16px; }
    .toprow .who { margin: 10px 0 14px; }
    /* this player's music on/off switch, next to their name */
    .mus { width: 76px; height: 76px; margin: 10px 0 14px; border-radius: 50%; border: 5px solid var(--ink); background: #fff; cursor: pointer;
      display: grid; place-items: center; box-shadow: 0 6px 0 rgba(0,0,0,0.35); -webkit-tap-highlight-color: transparent; padding: 0; }
    .mus:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.35); }
    .mus svg { width: 46px; height: 46px; }
    .mus.off { background: #e6e6e6; }
    /* this player's age preset: sprout kid = Little (gentle), tall kid = Big */
    .mus.age.little { background: #c7f9cc; }
    .mus.age svg { width: 54px; height: 54px; }

    .pl-overlay { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px;
      background: rgba(21, 14, 56, 0.82); backdrop-filter: blur(3px); overflow-y: auto; }
    .pl-overlay[hidden] { display: none; }
    .pl-panel { position: relative; width: min(720px, 100%); background: #fff8e6; color: var(--ink);
      border: 6px solid var(--ink); border-radius: 30px; padding: 18px 18px 22px; text-align: center;
      box-shadow: 0 12px 0 rgba(0,0,0,0.4); animation: pl-pop 0.25s ease-out; }
    @keyframes pl-pop { from { transform: scale(0.85); opacity: 0; } }
    .pl-panel h2 { margin: 0 0 12px; font-family: 'Lilita One', 'Arial Black', sans-serif; font-weight: 400; font-size: 34px; letter-spacing: 1px; }
    .pl-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; }
    .pl-tile { position: relative; width: 132px; display: flex; flex-direction: column; align-items: center; gap: 4px;
      background: none; border: 0; padding: 4px; cursor: pointer; font: inherit; font-weight: 900; font-size: 18px; color: var(--ink);
      -webkit-tap-highlight-color: transparent; }
    .pl-tile .av { width: 112px; height: 112px; border: 5px solid var(--ink); border-radius: 50%; overflow: hidden;
      box-shadow: 0 6px 0 rgba(0,0,0,0.25); transition: transform 0.15s; background: #fff; }
    .pl-tile:hover .av { transform: scale(1.06) rotate(-3deg); }
    .pl-tile:active .av { transform: scale(0.95); }
    .pl-tile.me .av { box-shadow: 0 0 0 6px #ffd166, 0 0 0 10px var(--ink); }
    .pl-tile .nm { margin-top: 8px; max-width: 128px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-height: 1.2em; }
    .pl-tile.add .av { display: grid; place-items: center; background: #e8e2ff; border-style: dashed; }
    .pl-tile.add .av svg { width: 60%; height: 60%; }
    .pl-tile .pen { position: absolute; top: 0; right: 4px; width: 44px; height: 44px; border-radius: 50%;
      background: #ffd166; border: 4px solid var(--ink); display: none; place-items: center; }
    .pl-tile .pen svg { width: 24px; height: 24px; }
    .pl-panel.editing .pl-tile .pen { display: grid; }
    .pl-panel.editing .pl-tile:not(.add) .av { animation: pl-wiggle 0.5s ease-in-out infinite alternate; }
    @keyframes pl-wiggle { from { rotate: -3deg; } to { rotate: 3deg; } }
    .pl-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 12px 0; }
    .pl-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-width: 72px; min-height: 72px;
      padding: 0 18px; border: 5px solid var(--ink); border-radius: 999px; background: #fff; cursor: pointer;
      font: inherit; font-weight: 900; font-size: 22px; color: var(--ink); box-shadow: 0 5px 0 rgba(0,0,0,0.3); }
    .pl-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.3); }
    .pl-btn svg { width: 36px; height: 36px; }
    .pl-btn.ok { background: var(--ar-green, #06d6a0); }
    .pl-btn.sure { background: #ef476f; color: #fff; animation: pl-wiggle 0.15s infinite alternate; }
    .pl-btn.on { background: #ffd166; }
    .pl-big { width: 150px; height: 150px; margin: 0 auto; border: 6px solid var(--ink); border-radius: 50%; overflow: hidden; }
    .pl-pet { width: 72px; height: 72px; padding: 0; border: 4px solid var(--ink); border-radius: 50%; overflow: hidden; background: #fff; cursor: pointer; }
    .pl-pet svg { width: 100%; height: 100%; display: block; }
    .pl-pet.sel, .pl-col.sel { box-shadow: 0 0 0 5px #ffd166, 0 0 0 8px var(--ink); }
    /* age preset: Little (3-5, gentle) or Big (6+) */
    .pl-age { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; width: 116px; min-height: 116px;
      padding: 4px; border: 5px solid var(--ink); border-radius: 24px; background: #fff; cursor: pointer; font: inherit; color: var(--ink);
      box-shadow: 0 5px 0 rgba(0,0,0,0.3); -webkit-tap-highlight-color: transparent; }
    .pl-age svg { width: 64px; height: 64px; }
    .pl-age b { font-size: 20px; line-height: 1; } .pl-age small { font-size: 15px; font-weight: 800; opacity: 0.7; }
    .pl-age.sel { background: #ffd166; box-shadow: 0 0 0 5px #ffd166, 0 0 0 8px var(--ink); }
    .who { position: relative; }
    .who .agebadge { position: absolute; left: 40px; bottom: -6px; width: 34px; height: 34px; border-radius: 50%;
      background: #fff8e6; border: 3px solid var(--ink); display: grid; place-items: center; }
    .who .agebadge svg, .pl-tile .agebadge svg { width: 28px; height: 28px; }
    .pl-tile .agebadge { position: absolute; left: 6px; top: 78px; width: 40px; height: 40px; border-radius: 50%;
      background: #fff8e6; border: 4px solid var(--ink); display: grid; place-items: center; }
    @media (max-width: 560px) { .pl-tile .agebadge { top: 58px; left: 2px; } }
    .pl-col { width: 64px; height: 64px; border: 4px solid var(--ink); border-radius: 50%; cursor: pointer; }
    .pl-name { width: min(320px, 100%); font: inherit; font-weight: 900; font-size: 26px; text-align: center;
      padding: 10px 16px; border: 5px solid var(--ink); border-radius: 20px; background: #fff; color: var(--ink); }
    @media (max-width: 560px) {
      .pl-tile { width: 104px; } .pl-tile .av { width: 88px; height: 88px; }
      .pl-pet { width: 64px; height: 64px; } .pl-col { width: 56px; height: 56px; }
    }

    /* favorite heart on each game box (top right of the picture) */
    .card .fav { position: absolute; top: 6px; right: 6px; z-index: 3; width: 70px; height: 70px;
      display: grid; place-items: center; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .card .fav svg { width: 50px; height: 50px; filter: drop-shadow(0 3px 0 rgba(0,0,0,0.35)); transition: transform 0.15s; }
    .card .fav:hover svg { transform: scale(1.15); }
    .card .fav.on svg { animation: fav-pop 0.35s ease-out; }
    @keyframes fav-pop { 50% { transform: scale(1.4); } }
    .card.isfav { border-color: #ff5fa2; }

    /* ---------- game types: big picture tabs (All, Faves, Race, Action, Sports, Calm) ---------- */
    .tabs { display: grid; grid-template-columns: repeat(auto-fit, minmax(76px, 1fr)); gap: 10px;
      max-width: 720px; margin: 14px auto 4px; padding: 0 16px; }
    .tab { min-height: 84px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
      background: #2e2270; color: #fff; border: 5px solid var(--ink); border-radius: 22px; cursor: pointer; padding: 4px;
      font: inherit; font-weight: 900; font-size: 16px; box-shadow: 0 5px 0 rgba(0,0,0,0.35); -webkit-tap-highlight-color: transparent; }
    .tab svg { width: 44px; height: 44px; }
    .tab:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.35); }
    .tab.on { background: #ffd166; color: var(--ink); box-shadow: 0 5px 0 rgba(0,0,0,0.35), 0 0 18px 4px rgba(255,209,102,0.55); }

    /* ---------- the Daily Surprise: today's little challenge (see arcade/daily.js) ---------- */
    .daily { display: flex; align-items: center; gap: 12px; max-width: 720px; margin: 14px auto 4px; padding: 10px 14px;
      background: linear-gradient(135deg, #fff3b0, #ffd6e8); color: var(--ink); border: 5px solid var(--ink); border-radius: 28px;
      box-shadow: 0 6px 0 rgba(0,0,0,0.35), 0 0 22px 4px rgba(255,209,102,0.35); }
    .daily[hidden] { display: none; }
    .daily .gift { width: 84px; height: 84px; flex: none; display: grid; place-items: center; }
    .daily .gift svg { width: 100%; height: 100%; filter: drop-shadow(0 4px 0 rgba(0,0,0,0.25)); }
    .daily:not(.done) .gift svg { animation: dl-wiggle 1.2s ease-in-out infinite; transform-origin: 50% 90%; }
    @keyframes dl-wiggle { 0%, 60%, 100% { transform: rotate(0); } 70% { transform: rotate(-9deg); } 80% { transform: rotate(8deg); } 90% { transform: rotate(-4deg); } }
    .daily .goal { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }
    .daily .gm { width: 70px; height: 70px; flex: none; border-radius: 50%; overflow: hidden; border: 4px solid var(--ink); background: #fff; }
    .daily .gm svg { width: 100%; height: 100%; display: block; }
    .daily .pic { width: 62px; height: 62px; flex: none; }
    .daily .pic svg { width: 100%; height: 100%; }
    .daily .num { font: 400 34px/1 'Lilita One', 'Arial Black', sans-serif; letter-spacing: 1px; }
    .daily .bar { flex-basis: 100%; max-width: 260px; height: 18px; border: 4px solid var(--ink); border-radius: 999px; background: #fff; overflow: hidden; }
    .daily .bar div { height: 100%; background: linear-gradient(90deg, #ff5fa2, #ffd166, #06d6a0); }
    .daily .prize { display: flex; align-items: center; gap: 2px; font-weight: 900; font-size: 22px; }
    .daily .prize svg { width: 40px; height: 40px; }
    .daily .prize .stk { width: 60px; height: 60px; flex: none; margin-right: 4px; }
    .daily .prize .stk svg { width: 100%; height: 100%; }
    .daily .prize .stk.locked { border-radius: 50%; background: #c77dff; border: 4px solid var(--ink); }   /* a mystery sticker: "?" */
    .daily .rnd { width: 72px; height: 72px; flex: none; border-radius: 50%; border: 5px solid var(--ink); background: #fff; cursor: pointer; padding: 0;
      display: grid; place-items: center; box-shadow: 0 5px 0 rgba(0,0,0,0.3); -webkit-tap-highlight-color: transparent; }
    .daily .rnd:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.3); }
    .daily .rnd svg { width: 42px; height: 42px; }
    .daily .rnd.go { background: var(--ar-green, #06d6a0); width: 84px; height: 84px; }
    .daily .rnd.go svg { width: 48px; height: 48px; }
    .daily .tick { width: 62px; height: 62px; flex: none; }
    .daily.done { background: linear-gradient(135deg, #d8f8e1, #fff3b0); }
    @media (max-width: 560px) {
      .daily .prize .stk { width: 48px; height: 48px; }
      .daily { margin: 12px 16px 4px; padding: 8px 10px; gap: 8px; flex-wrap: wrap; justify-content: center; }
      .daily .gift { width: 66px; height: 66px; } .daily .gm { width: 58px; height: 58px; } .daily .pic { width: 50px; height: 50px; }
      .daily .goal { flex: 1 1 60%; }
    }
    @media (prefers-reduced-motion: reduce) { .daily .gift svg { animation: none !important; } }

    /* ---------- "play again": the last games this player played ---------- */
    .recent { display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap;
      max-width: 1180px; margin: 12px auto 0; padding: 0 16px; }
    .recent[hidden] { display: none; }
    .recent .clock { width: 56px; height: 56px; flex: none; }
    .rc-btn { width: 96px; height: 96px; padding: 0; border-radius: 50%; overflow: hidden; cursor: pointer; background: #fff;
      border: 5px solid var(--ink); box-shadow: 0 0 0 4px var(--c, #fff), 0 6px 0 4px rgba(0,0,0,0.35); -webkit-tap-highlight-color: transparent;
      transition: transform 0.15s; }
    .rc-btn svg { width: 100%; height: 100%; display: block; }
    .rc-btn:hover { transform: scale(1.08) rotate(-4deg); }
    .rc-btn:active { transform: scale(0.94); }

    /* ---------- phones: smaller header, two small game boxes side by side ---------- */
    @media (max-width: 560px) {
      header { padding-top: 14px; }
      header .ar-logo { width: min(360px, 84vw); }
      .tabs { gap: 6px; padding: 0 12px; grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: 1fr; }   /* one row */
      .tab { min-height: 78px; font-size: 13px; border-width: 4px; border-radius: 18px; padding: 4px 0; } .tab svg { width: 36px; height: 36px; }
      .rc-btn { width: 80px; height: 80px; } .recent .clock { width: 44px; height: 44px; }
      .grid { --cols: 2; --gap: 12px; padding: 12px; }
    }
    /* small boxes: phones (both ways up) and short landscape screens */
    @media (max-width: 560px), (max-height: 500px) and (orientation: landscape) {
      .card { border-width: 5px; border-radius: 22px; }
      .card .art { height: 124px; border-bottom-width: 5px; }
      .card .badge { width: 98px; height: 98px; border-width: 5px; box-shadow: 0 0 0 4px #fff, 0 0 0 8px var(--ink), 0 6px 0 8px rgba(0,0,0,0.25); }
      .card .body { padding: 8px 10px 12px; gap: 4px; }
      .card h2 { font-size: 20px; text-align: center; }
      .card p { display: none; }                 /* the picture says it; keeps the boxes small */
      .card .foot { flex-wrap: wrap; justify-content: center; margin-top: 4px; gap: 6px; }
      .card .play { padding: 6px 16px; font-size: 19px; }
      .card .num { width: 32px; height: 32px; font-size: 16px; top: 6px; left: 6px; border-width: 3px; }
      .card .fav { width: 64px; height: 64px; top: 0; right: 0; } .card .fav svg { width: 42px; height: 42px; }
    }
    /* phones turned sideways: four small boxes across */
    @media (max-height: 500px) and (orientation: landscape) {
      header { padding-top: 10px; } header .ar-logo { width: min(320px, 44vw); }
      .grid { --cols: 4; --gap: 14px; }
      .tabs { max-width: 900px; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); }
      .tab { min-height: 72px; } .tab svg { width: 36px; height: 36px; }
    }
    /* sticker book + my house buttons, with a little number bubble */
    .mus.nav { position: relative; text-decoration: none; }
    #book { background: #ffd6ec; } #house { background: #fff1d0; }
    .mus.nav .bub { position: absolute; top: -10px; right: -10px; min-width: 34px; height: 34px; padding: 0 6px; border-radius: 999px;
      display: flex; align-items: center; justify-content: center; gap: 2px; border: 3px solid var(--ink); font-weight: 900; font-size: 17px; color: var(--ink); background: #fff; }
    .mus.nav .bub.new { background: #ff5fa2; color: #fff; animation: fav-pop 0.8s ease-in-out infinite; }
    .mus.nav .bub svg { width: 20px; height: 20px; }
    /* grown-ups: "Add to Home Screen" (only shows in a browser, not once it's an app) */
    .install { display: flex; justify-content: center; padding: 0 16px 30px; }
    .install[hidden] { display: none; }

              <path d="M196 96 L204 84 L212 96 L204 108 Z" fill="#ef476f" ${INK}/>`},
      { id: 'quest', type: 'action', dir: 'quest', name: 'Potion Quest', color: '#b8a4ff',
        text: 'Pick a hero, bonk the grumpy blobs and cast big potion magic!',

              <g class="wobble"><path d="M62 50 H78 V70 Q100 82 94 108 Q70 124 46 108 Q40 82 62 70 Z" fill="#4cc9f0" ${INK}/><rect x="58" y="40" width="24" height="12" rx="4" fill="#c68b59" ${INK}/><circle cx="60" cy="94" r="6" fill="#fff"/></g>`},

              <rect x="86" y="70" width="8" height="16" rx="4" fill="#f15bb5"/>`},
      { id: 'abc', type: 'calm', dir: 'abc', name: 'Bubble School', color: '#4cc9f0',
        text: 'Pop the right bubble: counting, letters and easy math.',
        art: `<rect x="0" y="130" width="240" height="30" fill="#f4d58d" ${INK}/>
              <g class="wobble"><circle cx="60" cy="56" r="30" fill="#bde0fe" ${INK}/><text x="60" y="70" font-size="38" font-weight="900" text-anchor="middle" fill="#2b2b2b" font-family="sans-serif">A</text>
              <circle cx="180" cy="48" r="26" fill="#bde0fe" ${INK}/><text x="180" y="61" font-size="34" font-weight="900" text-anchor="middle" fill="#2b2b2b" font-family="sans-serif">3</text></g>
              <ellipse cx="120" cy="108" rx="30" ry="26" fill="#c77dff" ${INK}/><circle cx="110" cy="104" r="4" fill="#2b2b2b"/><circle cx="130" cy="104" r="4" fill="#2b2b2b"/>
              <path d="M112 116 Q120 122 128 116" fill="none" ${INK} stroke-width="3"/><path d="M98 84 L120 74 L142 84 L120 92 Z" fill="#2b2b2b"/>`},

              <g class="wobble"><circle cx="85" cy="60" r="12" fill="#ef476f" ${INK}/><circle cx="125" cy="48" r="12" fill="#06d6a0" ${INK}/><circle cx="165" cy="65" r="12" fill="#118ab2" ${INK}/><circle cx="75" cy="102" r="12" fill="#9b5de5" ${INK}/></g>`},

    const grid = document.getElementById('grid');
    const playIcon = Arcade.icons.play;
    const P = Arcade.profiles, esc = Arcade.escapeHTML;
    // little pictures for the player buttons (no words needed)
    const PIC = {
      heart: (on) => `<svg viewBox="0 0 48 48"><path d="M24 42 C6 30 2 18 10 11 C16 6 22 9 24 14 C26 9 32 6 38 11 C46 18 42 30 24 42 Z" fill="${on ? '#ff5fa2' : '#fff'}" stroke="#2b2b2b" stroke-width="4" stroke-linejoin="round"/>${on ? '<ellipse cx="15" cy="17" rx="3" ry="5" fill="#fff" opacity="0.7"/>' : ''}</svg>`,
      swap: `<svg viewBox="0 0 48 48" fill="none" stroke="#2b2b2b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 18 H38 L30 10 M40 30 H10 L18 38"/></svg>`,
      plus: `<svg viewBox="0 0 48 48"><path d="M24 8 V40 M8 24 H40" stroke="#2b2b2b" stroke-width="7" stroke-linecap="round"/></svg>`,
      pen: `<svg viewBox="0 0 48 48"><path d="M10 38 L12 28 L32 8 L40 16 L20 36 Z" fill="#fff" stroke="#2b2b2b" stroke-width="4" stroke-linejoin="round"/><path d="M28 12 L36 20" stroke="#2b2b2b" stroke-width="4"/></svg>`,
      ok: `<svg viewBox="0 0 48 48"><path d="M8 26 L20 37 L40 12" fill="none" stroke="#2b2b2b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
      no: `<svg viewBox="0 0 48 48"><path d="M12 12 L36 36 M36 12 L12 36" stroke="#2b2b2b" stroke-width="7" stroke-linecap="round"/></svg>`,
      bin: `<svg viewBox="0 0 48 48"><path d="M10 14 H38 M18 14 V8 H30 V14 M13 14 L15 42 H33 L35 14" fill="#fff" stroke="#2b2b2b" stroke-width="4" stroke-linejoin="round"/><path d="M21 20 V36 M27 20 V36" stroke="#2b2b2b" stroke-width="3"/></svg>`,
    };

    // ---------- the picture tabs: kinds of games ----------
    // "all" shows every game, "fav" only this player's hearts (the tab hides until there is one),
    // the rest match each game's "type". Short words are OK; the pictures do the talking.
    const T = 'stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"';
    const TABS = [
      { id: 'all', word: 'All', pic: `<svg viewBox="0 0 48 48"><rect x="5" y="5" width="16" height="16" rx="4" fill="#ef476f" ${T}/><rect x="27" y="5" width="16" height="16" rx="4" fill="#ffd166" ${T}/><rect x="5" y="27" width="16" height="16" rx="4" fill="#06d6a0" ${T}/><rect x="27" y="27" width="16" height="16" rx="4" fill="#4cc9f0" ${T}/></svg>` },
      { id: 'fav', word: 'Faves', pic: PIC.heart(true) },
      { id: 'race', word: 'Race', pic: `<svg viewBox="0 0 48 48"><path d="M10 44 V6" ${T} fill="none" stroke-width="4.5"/><path d="M11 8 H40 V28 H11 Z" fill="#fff" ${T}/><path d="M11 8 h7 v5 h-7 Z M25 8 h7 v5 h-7 Z M18 13 h7 v5 h-7 Z M32 13 h8 v5 h-8 Z M11 18 h7 v5 h-7 Z M25 18 h7 v5 h-7 Z M18 23 h7 v5 h-7 Z M32 23 h8 v5 h-8 Z" fill="#2b2b2b"/><path d="M11 8 H40 V28 H11 Z" fill="none" ${T}/></svg>` },
      { id: 'action', word: 'Action', pic: `<svg viewBox="0 0 48 48"><path d="M24 3 C34 10 36 22 32 33 H16 C12 22 14 10 24 3 Z" fill="#fff" ${T}/><circle cx="24" cy="18" r="5" fill="#4cc9f0" ${T} stroke-width="3"/><path d="M16 26 L8 36 L16 34 Z M32 26 L40 36 L32 34 Z" fill="#ef476f" ${T}/><path d="M19 34 Q24 48 29 34 Z" fill="#ffd166" ${T}/></svg>` },
      { id: 'sports', word: 'Sports', pic: `<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="19" fill="#ff8c42" ${T}/><path d="M5 24 H43 M24 5 V43 M11 11 Q22 24 11 37 M37 11 Q26 24 37 37" fill="none" ${T} stroke-width="3"/></svg>` },
      { id: 'calm', word: 'Calm', pic: `<svg viewBox="0 0 48 48"><path d="M10 38 L30 8 L40 14 L20 44 L8 46 Z" fill="#9b5de5" ${T}/><path d="M30 8 L40 14 L36 20 L26 14 Z" fill="#ff8fab" ${T}/><path d="M10 38 L20 44 L8 46 Z" fill="#f5d3a6" ${T}/></svg>` },
    ];
    const tabsEl = document.getElementById('tabs');
    const recentEl = document.getElementById('recent');
    // which tab is open (each player remembers their own)
    function currentTab() {
      let t = Arcade.store.load().hubTab || 'all';
      if (!TABS.some(x => x.id === t)) t = 'all';
      if (t === 'fav' && !Arcade.store.load().favorites.length) t = 'all';   // no hearts left: back to all
      return t;
    }
    function renderTabs() {
      const cur = currentTab(), hasFav = Arcade.store.load().favorites.length > 0;
      tabsEl.innerHTML = TABS.filter(t => t.id !== 'fav' || hasFav).map(t =>
        `<button class="tab${t.id === cur ? ' on' : ''}" data-tab="${t.id}" type="button" aria-pressed="${t.id === cur}">${t.pic}<span>${t.word}</span></button>`).join('');
    }
    tabsEl.addEventListener('click', (e) => {
      const b = e.target.closest('[data-tab]');
      if (!b) return;
      Arcade.audio.resume(); Arcade.sfx('pop');
      Arcade.store.load().hubTab = b.dataset.tab; Arcade.store.save();
      renderHub();
    });

    // open a game: remember it for "play again", a happy blip, then go (short delay so the sound is heard)
    function openGame(game) {
      Arcade.audio.resume();
      Arcade.store.markPlayed(game.id);
      Arcade.sfx('coin');
      setTimeout(() => { location.href = game.dir + '/index.html'; }, 160);
    }

    // ---------- "play again": the last 3 games this player opened (on the All tab) ----------
    const CLOCK = `<svg class="clock" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="19" fill="#fff" ${T} stroke-width="4"/><path d="M24 12 V24 L32 29" fill="none" ${T} stroke-width="4.5"/><path d="M4 12 L8 20 L15 14" fill="none" stroke="#ffd166" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    function renderRecent() {
      const ids = Arcade.store.recent().filter(id => GAMES.some(g => g.id === id)).slice(0, 3);
      recentEl.hidden = currentTab() !== 'all' || !ids.length;
      recentEl.innerHTML = CLOCK + ids.map(id => {
        const game = GAMES.find(g => g.id === id);
        return `<button class="rc-btn" data-recent="${id}" type="button" aria-label="Play ${game.name} again" style="--c:${game.color}"><svg viewBox="0 0 240 240">${Arcade.badges[id] || ''}</svg></button>`;
      }).join('');
    }
    recentEl.addEventListener('click', (e) => {
      const b = e.target.closest('[data-recent]');
      if (b) openGame(GAMES.find(g => g.id === b.dataset.recent));
    });
    recentEl.addEventListener('pointerover', (e) => { if (e.target.closest('[data-recent]') && !e.target.closest('[data-recent]').contains(e.relatedTarget)) Arcade.sfx('tick'); });

    // ---------- the game boxes (favorites first) for the open tab ----------
    function renderCards() {
      grid.innerHTML = '';
      const tab = currentTab();
      const shown = GAMES.filter(g => tab === 'all' || (tab === 'fav' ? Arcade.store.isFavorite(g.id) : g.type === tab));
      const favs = shown.filter(g => Arcade.store.isFavorite(g.id));
      const list = favs.concat(shown.filter(g => !favs.includes(g)));
      list.forEach((game, i) => {
        const s = Arcade.summary(game.id);
        let prog = '';
        if (s.gold || s.silver || s.bronze) {
          const best = s.gold ? 'gold' : s.silver ? 'silver' : 'bronze';
          prog += Arcade.icons.medal(best) + (s.gold + s.silver + s.bronze);
        }
        if (s.stars) prog += Arcade.icons.star(true) + s.stars;
        const fav = Arcade.store.isFavorite(game.id);
        const card = document.createElement('a');
        card.className = 'card' + (fav ? ' isfav' : '');
        card.href = game.dir + '/index.html';
        card.dataset.game = game.id;
        card.style.setProperty('--c', game.color);
        // a lighter version of the color for the name and glow (extra light if the color is dark)
        const n = parseInt(game.color.slice(1), 16), light = ((n >> 16) * 0.3 + ((n >> 8) & 255) * 0.59 + (n & 255) * 0.11) / 255;
        card.style.setProperty('--c2', Arcade.mixWhite(game.color, light < 0.4 ? 0.8 : 0.6));
        card.setAttribute('aria-label', game.name);
        card.innerHTML = `
          <div class="art"><div class="rays"></div><div class="badge"><svg viewBox="0 0 240 240">${Arcade.badges[game.id] || ''}</svg></div></div>
          <div class="num">${i + 1}</div>
          <span class="fav${fav ? ' on' : ''}" role="button" aria-label="Favorite" aria-pressed="${fav}">${PIC.heart(fav)}</span>
          <div class="body">
            <h2>${game.name}</h2>
            <p>${game.text}</p>
            <div class="foot">
              <span class="play">${playIcon}Play</span>
              <span class="progress">${prog}</span>
            </div>
          </div>`;
        card.addEventListener('pointerenter', () => Arcade.sfx('tick'));
        card.addEventListener('click', (e) => {
          e.preventDefault();
          // the heart: make this a favorite (or not) instead of opening the game
          if (e.target.closest('.fav')) {
            Arcade.audio.resume();
            const on = Arcade.store.toggleFavorite(game.id);
            Arcade.sfx(on ? 'star' : 'pop');
            renderHub();
            return;
          }
          openGame(game);
        });
        grid.appendChild(card);
      });
    }

    // ---------- the Daily Surprise: a wrapped present with today's challenge ----------
    // [present] [game picture + goal picture (+ how many)] [speaker] [Play]
    // Done: the present is open, with a big tick and what you got (a sticker + 2 coins).
    const dailyEl = document.getElementById('daily');
    const COIN_SMALL = `<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="17" fill="#ffc93c" stroke="#2b2b2b" stroke-width="5"/></svg>`;
    const TICK = `<svg class="tick" viewBox="0 0 48 48"><circle cx="24" cy="24" r="20" fill="#06d6a0" stroke="#2b2b2b" stroke-width="4"/><path d="M13 25 L21 33 L35 16" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    function renderDaily() {
      const D = Arcade.daily;
      if (!D) { dailyEl.hidden = true; return; }
      const t = D.today(), ch = t.ch;
      const game = GAMES.find(g => g.id === ch.game);
      dailyEl.hidden = false;
      dailyEl.classList.toggle('done', t.done);
      const gm = game ? `<span class="gm"><svg viewBox="0 0 240 240">${Arcade.badges[game.id] || ''}</svg></span>` : '';
      const counting = ch.kind === 'count' || ch.kind === 'games';
      // the prize: the next surprise sticker (while there are some left) + 2 coins
      const next = Arcade.stickers.list.find(s => s.game === 'surprise' && s.n === t.total + (t.done ? 0 : 1));
      const prize = `<span class="prize">${next ? `<span class="stk${t.done ? '' : ' locked'}">${Arcade.stickers.svg(next, !t.done)}</span>` : ''}${COIN_SMALL}${Arcade.daily.REWARD_COINS}</span>`;
      dailyEl.innerHTML = `<span class="gift">${D.gift(t.done)}</span>` +
        `<div class="goal">${gm}<span class="pic">${D.pic(ch)}</span>${counting ? `<span class="num">${t.done ? t.need : t.n} / ${t.need}</span>` : ''}` +
        (counting && !t.done ? `<div class="bar"><div style="width:${100 * t.n / t.need}%"></div></div>` : '') + `</div>` +
        (t.done ? TICK + prize : prize) +
        `<button class="rnd" type="button" data-say="1" aria-label="Hear it">${Arcade.icons.sound}</button>` +
        (!t.done && game ? `<button class="rnd go" type="button" data-go="${game.id}" aria-label="Play ${game.name}">${playIcon}</button>` : '');
      dailyEl.setAttribute('aria-label', 'Daily surprise: ' + D.words(ch) + (t.done ? ' Done!' : ''));
    }
    dailyEl.addEventListener('click', (e) => {
      const D = Arcade.daily, t = D.today();
      Arcade.audio.resume();
      const go = e.target.closest('[data-go]');
      if (go) { openGame(GAMES.find(g => g.id === go.dataset.go)); return; }
      // the speaker (or anywhere else on the box): read the challenge aloud
      Arcade.sfx('pop');
      D.say(t.done ? 'You did it! A new surprise comes tomorrow.' : 'Today\'s surprise. ' + D.words(t.ch));
    });

    // the whole hub: the surprise, tabs, "play again" row and the game boxes
    function renderHub() { renderDaily(); renderTabs(); renderRecent(); renderCards(); }

    // ---------- players ----------
    const whoBtn = document.getElementById('who');
    const overlay = document.getElementById('players');
    const panel = document.getElementById('plpanel');
    function renderWho() {
      const me = P.active();
      // (a little kid gets a small sprout badge on their picture: the gentle preset is on)
      whoBtn.innerHTML = `<span class="av">${P.avatar(me)}</span>${P.little() ? `<span class="agebadge" title="Little kid">${Arcade.icons.little}</span>` : ''}<span class="nm">${esc(me.name)}</span>${PIC.swap}`;
      // the music switch shows this player's setting
      const on = Arcade.store.settings().musicOn !== false;
      musBtn.innerHTML = on ? Arcade.icons.music : Arcade.icons.musicOff;
      musBtn.classList.toggle('off', !on);
      musBtn.setAttribute('aria-label', on ? 'Music is on' : 'Music is off');
      musBtn.setAttribute('aria-pressed', String(on));
      // the age button shows this player's preset
      const little = P.little();
      ageBtn.innerHTML = little ? Arcade.icons.little : Arcade.icons.big;
      ageBtn.classList.toggle('little', little);
      ageBtn.setAttribute('aria-label', little ? 'Little kid mode (gentle games). Tap for big kid mode' : 'Big kid mode. Tap for little kid mode');
      ageBtn.title = little ? 'Little kid (3-5): gentle games' : 'Big kid (6+)';
      Arcade.audio.applyVolumes();          // (each player has their own music switch)
    }
    // Music on/off for this player (each player keeps their own). Turning it on plays a
    // little jingle so you can hear it worked.
    const musBtn = document.getElementById('mus');
    musBtn.addEventListener('click', () => {
      const s = Arcade.store.settings();
      s.musicOn = s.musicOn === false;
      Arcade.store.save();
      Arcade.audio.resume(); Arcade.audio.applyVolumes();
      if (s.musicOn) { Arcade.audio.keepPlaying('arcade', { quick: true }); Arcade.audio.stinger('treasure'); } else Arcade.sfx('click');
      renderWho();
    });
    // Little / Big for this player, right on the hub (also in the player editor).
    const ageBtn = document.getElementById('age');
    ageBtn.addEventListener('click', () => {
      const me = P.active();
      P.update(me.id, { age: P.little() ? 'big' : 'little' });
      Arcade.audio.resume();
      Arcade.sfx(P.little() ? 'spring' : 'pop');
      Arcade.toast(P.little() ? 'Little kid mode' : 'Big kid mode', P.little() ? Arcade.icons.little : Arcade.icons.big);
      renderWho();
    });
    function closePlayers() {
      overlay.hidden = true;
      try { sessionStorage.setItem('kidsArcade.picked', '1'); } catch (e) { /* skip */ }
    }
    // "Who's playing?": a big avatar for every player, plus a + to add one.
    // The pencil turns on edit mode: then tapping a player opens their editor.
    function showPlayers(editing) {
      overlay.hidden = false;
      panel.className = 'pl-panel' + (editing ? ' editing' : '');
      const me = P.active();
      const tiles = P.list().map(p => `<button class="pl-tile${p.id === me.id ? ' me' : ''}" data-id="${p.id}" type="button" aria-label="${esc(p.name || 'Player')}">
          <span class="av">${P.avatar(p)}</span>${P.little(p) ? `<span class="agebadge">${Arcade.icons.little}</span>` : ''}<span class="nm">${esc(p.name)}</span><span class="pen">${PIC.pen}</span></button>`).join('');
      const add = P.list().length < 8 ? `<button class="pl-tile add" data-add="1" type="button" aria-label="New player"><span class="av">${PIC.plus}</span><span class="nm"></span></button>` : '';
      panel.innerHTML = `<h2>Who's playing?</h2><div class="pl-grid">${tiles}${add}</div>
        <div class="pl-row"><button class="pl-btn${editing ? ' on' : ''}" data-edit="1" type="button" aria-label="Change players">${PIC.pen}</button>
        <button class="pl-btn" data-close="1" type="button" aria-label="Close">${PIC.no}</button></div>`;
      panel.onclick = (e) => {
        const t = e.target.closest('button');
        if (!t) return;
        Arcade.audio.resume();
        if (t.dataset.close) { Arcade.sfx('click'); closePlayers(); return; }
        if (t.dataset.edit) { Arcade.sfx('click'); showPlayers(!editing); return; }
        if (t.dataset.add) { Arcade.sfx('pop'); editPlayer(null); return; }
        if (t.dataset.id) {
          if (editing) { Arcade.sfx('click'); editPlayer(t.dataset.id); return; }
          P.use(t.dataset.id);              // switch: from now on every game saves for this player
          Arcade.sfx('coin');
          closePlayers(); renderWho(); renderHub(); renderNav();
          Arcade.toast(P.active().name ? 'Hi ' + esc(P.active().name) + '!' : 'Hi!', P.avatar());
        }
      };
    }
    // Make or change a player: pick an animal, a color and (if you like) type a name.
    function editPlayer(id) {
      const old = id ? P.list().find(p => p.id === id) : null;
      const pick = old ? { pet: old.pet, color: old.color, name: old.name, age: P.age(old) }
        : { pet: P.pets[P.list().length % P.pets.length], color: P.colors[P.list().length % P.colors.length], name: '', age: 'big' };
      panel.className = 'pl-panel';
      const draw = () => {
        panel.innerHTML = `<div class="pl-big">${P.avatar(pick)}</div>
          <div class="pl-row">${P.pets.map(k => `<button class="pl-pet${k === pick.pet ? ' sel' : ''}" data-pet="${k}" type="button" aria-label="${k}">${P.avatar({ pet: k, color: pick.color })}</button>`).join('')}</div>
          <div class="pl-row">${P.colors.map(c => `<button class="pl-col${c === pick.color ? ' sel' : ''}" data-col="${c}" type="button" aria-label="color" style="background:${c}"></button>`).join('')}</div>
          <input class="pl-name" maxlength="12" placeholder="Name" value="${esc(pick.name)}" aria-label="Name" autocomplete="off">
          <div class="pl-row pl-ages">
            <button class="pl-age${pick.age === 'little' ? ' sel' : ''}" data-age="little" type="button" aria-label="Little kid, ages 3 to 5: gentle games">${Arcade.icons.little}<b>Little</b><small>3-5</small></button>
            <button class="pl-age${pick.age === 'big' ? ' sel' : ''}" data-age="big" type="button" aria-label="Big kid, ages 6 and up">${Arcade.icons.big}<b>Big</b><small>6+</small></button>
          </div>
          <div class="pl-row">
            <button class="pl-btn ok" data-ok="1" type="button" aria-label="Done">${PIC.ok}</button>
            ${old && P.list().length > 1 ? `<button class="pl-btn" data-del="1" type="button" aria-label="Delete player">${PIC.bin}</button>` : ''}
            <button class="pl-btn" data-back="1" type="button" aria-label="Back">${PIC.no}</button>
          </div>`;
        panel.querySelector('.pl-name').addEventListener('input', (e) => { pick.name = e.target.value; });
      };
      draw();
      let sureTimer = null;
      panel.onclick = (e) => {
        const t = e.target.closest('button');
        if (!t) return;
        if (t.dataset.pet) { pick.pet = t.dataset.pet; Arcade.sfx('pop'); draw(); }
        else if (t.dataset.col) { pick.color = t.dataset.col; Arcade.sfx('pop'); draw(); }
        else if (t.dataset.age) { pick.age = t.dataset.age; Arcade.sfx(pick.age === 'little' ? 'spring' : 'pop'); draw(); }
        else if (t.dataset.back) { Arcade.sfx('click'); showPlayers(!!old); }
        else if (t.dataset.ok) {
          pick.name = pick.name.trim().slice(0, 12);
          if (old) P.update(old.id, pick);
          else P.use(P.add(pick).id);       // a brand-new player starts playing right away
          Arcade.sfx('star');
          renderWho(); renderHub(); renderNav();
          showPlayers(false);
        } else if (t.dataset.del) {
          // tap the bin twice to delete (it turns red and wiggles first)
          if (!t.classList.contains('sure')) {
            t.classList.add('sure'); Arcade.sfx('beep');
            clearTimeout(sureTimer); sureTimer = setTimeout(() => t.classList.remove('sure'), 3000);
            return;
          }
          P.remove(old.id); Arcade.sfx('pop');
          renderWho(); renderHub(); renderNav(); showPlayers(false);
        }
      };
    }
    whoBtn.addEventListener('click', () => { Arcade.audio.resume(); Arcade.sfx('click'); showPlayers(false); });
    overlay.addEventListener('click', (e) => { if (e.target === overlay) closePlayers(); });
    addEventListener('keydown', (e) => { if (e.key === 'Escape' && !overlay.hidden) closePlayers(); });

    renderWho();
    renderHub();
    // ---------- sticker book + my house buttons ----------
    // The book shows how many new stickers are waiting; the house shows your coins
    // (1 coin per trophy, 3 to start: see house/house.js).
    const BOOK_PIC = `<svg viewBox="0 0 48 48"><path d="M8 6 H36 Q42 6 42 12 V42 H14 Q8 42 8 36 Z" fill="#ef476f" stroke="#2b2b2b" stroke-width="4" stroke-linejoin="round"/><path d="M14 42 Q8 42 8 36 Q8 32 14 32 H42" fill="#fff" stroke="#2b2b2b" stroke-width="4" stroke-linejoin="round"/><path d="M25 10 L28 17 L35 17 L29.5 21.5 L31.5 28 L25 24 L18.5 28 L20.5 21.5 L15 17 L22 17 Z" fill="#ffd166" stroke="#2b2b2b" stroke-width="2.5" stroke-linejoin="round"/></svg>`;
    const HOUSE_PIC = `<svg viewBox="0 0 48 48"><path d="M5 23 L24 6 L43 23" fill="none" stroke="#2b2b2b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 20 V42 H38 V20 L24 9 Z" fill="#ffd166" stroke="#2b2b2b" stroke-width="4" stroke-linejoin="round"/><rect x="20" y="28" width="9" height="14" fill="#ef476f" stroke="#2b2b2b" stroke-width="3"/><rect x="31" y="22" width="5" height="5" fill="#9fe0ff" stroke="#2b2b2b" stroke-width="2"/></svg>`;
    const COIN_PIC = `<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="19" fill="#ffc93c" stroke="#2b2b2b" stroke-width="5"/></svg>`;
    function renderNav() {
      Arcade.stickers.check(true);
      const fresh = Arcade.stickers.unseen().length;
      document.getElementById('book').innerHTML = BOOK_PIC + (fresh ? `<span class="bub new">${fresh}</span>` : '');
      const h = Arcade.store.load().house || {};
      const coins = 3 + Arcade.stickers.trophyCount() + (Arcade.store.load().houseBonus || 0) - (h.spent || 0);
      document.getElementById('house').innerHTML = HOUSE_PIC + `<span class="bub">${COIN_PIC}${coins}</span>`;
    }
    renderNav();
    // ---------- "Add to Home Screen" (for grown-ups) ----------
    // Android/Chrome: the browser offers its own install box (we keep the offer and
    // show it when the button is tapped). iPhone/iPad: Safari can't do that, so the
    // button shows pictures of the 2 taps instead (Share, then "Add to Home Screen").
    (function () {
      const box = document.getElementById('install');
      if (document.documentElement.classList.contains('ar-app')) return;       // already an app
      const PHONE = `<svg viewBox="0 0 48 48"><rect x="12" y="4" width="24" height="40" rx="5" fill="#fff" stroke="#2b2b2b" stroke-width="4"/><rect x="17" y="10" width="14" height="14" rx="3" fill="#9b5de5" stroke="#2b2b2b" stroke-width="2.5"/><circle cx="35" cy="34" r="10" fill="#06d6a0" stroke="#2b2b2b" stroke-width="3.5"/><path d="M35 28 V40 M29 34 H41" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round"/></svg>`;
      const SHARE = `<svg viewBox="0 0 48 48"><rect x="10" y="18" width="28" height="26" rx="4" fill="#fff" stroke="#2b2b2b" stroke-width="4"/><path d="M24 30 V6 M16 13 L24 5 L32 13" fill="none" stroke="#118ab2" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
      const ADD = `<svg viewBox="0 0 48 48"><rect x="6" y="6" width="36" height="36" rx="9" fill="#fff" stroke="#2b2b2b" stroke-width="4"/><path d="M24 14 V34 M14 24 H34" stroke="#2b2b2b" stroke-width="5" stroke-linecap="round"/></svg>`;
      let offer = null;
      const show = () => { box.hidden = false; box.innerHTML = `<button type="button" id="addhome">${PHONE}<span>Add to Home Screen</span></button>`; };
      addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); offer = e; show(); });
      const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (ios) show();
      box.addEventListener('click', async () => {
        Arcade.audio.resume(); Arcade.sfx('click');
        if (offer) { offer.prompt(); const r = await offer.userChoice; if (r.outcome === 'accepted') box.hidden = true; offer = null; return; }
        const ov = document.getElementById('howadd');
        document.getElementById('howaddpanel').innerHTML = `<h2>${PHONE}</h2><div class="howadd-steps">1 ${SHARE} <span>→</span> 2 ${ADD}<span>Add to Home Screen</span></div>` +
          `<div class="pl-row"><button class="pl-btn ok" type="button" id="howaddok">${PIC.ok}</button></div>`;
        ov.hidden = false;
        document.getElementById('howaddok').onclick = () => { Arcade.sfx('click'); ov.hidden = true; };
      });
      addEventListener('appinstalled', () => { box.hidden = true; });
    })();
    for (const id of ['book', 'house']) document.getElementById(id).addEventListener('click', () => { Arcade.audio.resume(); Arcade.sfx('coin'); });
    // Hub music: the arcade song. Browsers only allow sound after the first tap or key,
    // so it starts right then: straight into the tune (no quiet intro), with a quick fade in.
    // (iPhones and iPads only count the END of a tap, so we listen for every kind of tap and
    //  keep listening until the sound is really running.)
    const TAPS = ['pointerdown', 'pointerup', 'touchend', 'click', 'keydown'];
    const startMusic = () => {
      const c = Arcade.audio.ensure();
      if (!c) return;
      if (c.state !== 'running') {
        Arcade.audio.resume();
        // start the song fresh the moment the sound wakes up, so it begins at the top
        c.onstatechange = () => { if (c.state === 'running') { Arcade.audio.play('arcade', { quick: true }); c.onstatechange = null; } };
      } else Arcade.audio.keepPlaying('arcade', { quick: true });
      if (c.state === 'running') TAPS.forEach(t => removeEventListener(t, startMusic, true));
    };
    TAPS.forEach(t => addEventListener(t, startMusic, true));
    startMusic();                            // (plays at once if the browser already allows sound)
    // with more than one player, ask "Who's playing?" when the arcade first opens
    let picked = false;
    try { picked = !!sessionStorage.getItem('kidsArcade.picked'); } catch (e) { /* skip */ }
    if (P.list().length > 1 && !picked) showPlayers(false);

    // test hook for the automated tests
    window.__hubState = () => ({ player: P.active().id, musicOn: Arcade.store.settings().musicOn !== false, players: P.list().length, age: P.age(), song: Arcade.audio.track ? Arcade.audio.track.song === Arcade.audio.songs.arcade : false, order: [...grid.children].map(c => c.dataset.game), tab: currentTab(), tabs: [...tabsEl.children].map(b => b.dataset.tab), recent: [...recentEl.querySelectorAll('[data-recent]')].map(b => b.dataset.recent), favorites: Arcade.store.load().favorites.slice(), daily: Arcade.daily ? Object.assign({ key: Arcade.store.load().daily.key }, Arcade.daily.today()) : null });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Kids Game</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Hub: two giant picture buttons, side by side (stacked on narrow phones) */
    .hub {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6vmin;
      padding: 16px;
      flex-wrap: wrap;
    }
    .game-btn {
      width: min(40vmin, 300px);
      height: min(40vmin, 300px);
      min-width: 150px;
      min-height: 150px;
      border-radius: 40px;
      border: 7px solid var(--ink);
      box-shadow: 0 10px 0 rgba(0,0,0,0.18);
      display: grid;
      place-items: center;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.12s;
      padding: 0;
    }
    .game-btn:active { transform: translateY(6px) scale(0.97); box-shadow: none; }
    .game-btn svg { width: 72%; height: 72%; }
    .coloring { background: #ffd166; animation: bob 3s ease-in-out infinite; }
    .maze { background: #8ecae6; animation: bob 3s ease-in-out 1.5s infinite; }

    @keyframes bob { 50% { transform: translateY(-8px); } }
    /* "Not ready yet" wiggle for the maze until it's built */
    .wiggle { animation: wiggle 0.5s; }
    @keyframes wiggle {
      20% { transform: rotate(-8deg); } 40% { transform: rotate(8deg); }
      60% { transform: rotate(-5deg); } 80% { transform: rotate(5deg); }
    }
  </style>
</head>
<body>
  <main class="hub">
    <!-- Coloring game: paint palette + brush -->
    <a class="game-btn coloring" href="coloring/index.html" aria-label="Coloring">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <path d="M50 10 C80 10 95 30 92 52 C90 66 78 66 70 62 C62 58 56 64 60 74
                 C64 86 56 92 46 90 C20 86 6 66 8 46 C10 24 28 10 50 10 Z"
              fill="#fff" stroke="#2b2b2b" stroke-width="4"/>
        <circle cx="32" cy="34" r="8" fill="#ef476f" stroke="#2b2b2b" stroke-width="3"/>
        <circle cx="54" cy="26" r="8" fill="#06d6a0" stroke="#2b2b2b" stroke-width="3"/>
        <circle cx="74" cy="38" r="8" fill="#118ab2" stroke="#2b2b2b" stroke-width="3"/>
        <circle cx="26" cy="58" r="8" fill="#ffd166" stroke="#2b2b2b" stroke-width="3"/>
        <circle cx="42" cy="74" r="8" fill="#9b5de5" stroke="#2b2b2b" stroke-width="3"/>
      </svg>
    </a>

    <!-- Maze game (coming soon) -->
    <button class="game-btn maze" id="mazeBtn" aria-label="Maze">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <rect x="10" y="10" width="80" height="80" rx="10" fill="#fff" stroke="#2b2b2b" stroke-width="4"/>
        <path d="M10 32 H66 M34 54 H90 M10 76 H62" stroke="#2b2b2b" stroke-width="5" stroke-linecap="round"/>
        <circle cx="20" cy="21" r="6" fill="#06d6a0" stroke="#2b2b2b" stroke-width="2.5"/>
        <path d="M74 82 l3 -7 l7 -1 l-5 -5 l1 -7 l-6 3 l-6 -3 l1 7 l-5 5 l7 1 z"
              fill="#ffd166" stroke="#2b2b2b" stroke-width="2"/>
      </svg>
    </button>
  </main>

  <script>
    // Maze isn't built yet — give a friendly wiggle instead of doing nothing.
    const mazeBtn = document.getElementById('mazeBtn');
    mazeBtn.addEventListener('click', () => {
      mazeBtn.classList.remove('wiggle');
      void mazeBtn.offsetWidth; // restart the animation
      mazeBtn.classList.add('wiggle');
    });
  </script>
</body>
</html>

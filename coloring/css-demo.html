<!DOCTYPE html>
<!--
  COLORING PAGES IN PURE HTML/CSS — a standalone demo (Keith, Nov 10).
  The real coloring book (coloring/index.html) still uses the SVG pages.

  How a picture is built:
  - Every picture is a <template> full of <i> tags. Each <i> is ONE shape on a
    400 x 400 grid, placed by its middle: --cx, --cy (center), --w, --h (size),
    --r (corner rounding, default 50% = an ellipse) and --rot (a tilt).
  - Shapes are listed back-to-front, like stacking paper cut-outs: the sky first,
    then the ground, body, head... A later shape covers the ones before it.
  - class="r"   = a colorable region (tap it to fill it)
    class="d"   = a dark detail (eyes, whiskers)      class="d w" = a white shine dot
    class="ln"  = a curved line (a smile): only the bottom edge of an ellipse
  - The animation is all CSS: when a picture opens, every outline traces itself
    one after another (back to front), then the white shapes fill in behind
    them in the same order (that's what hides the lines that sit "behind"),
    and last the eyes and smiles pop in. The delays come from each shape's
    number --i (set by the 3 lines of JavaScript at the bottom).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coloring pages (HTML/CSS demo)</title>
<style>
  :root { --ink: #2b2b2b; --paper: #fdf6e3; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--paper);
    font-family: system-ui, sans-serif; color: var(--ink);
    display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 14px;
  }

  /* ---------- The picker: 6 small copies of the pictures ---------- */
  .picker { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  .picker button {
    width: 86px; padding: 0; border: 5px solid var(--ink); border-radius: 18px;
    overflow: hidden; background: #fff; cursor: pointer; box-shadow: 0 5px 0 var(--ink);
  }
  .picker button.on { outline: 5px solid #ffd166; outline-offset: 2px; }
  .picker button:active { transform: translateY(4px); box-shadow: none; }

  .main { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 14px; }
  .frame {
    width: min(92vw, 62vh, 560px); border: 6px solid var(--ink); border-radius: 26px;
    overflow: hidden; box-shadow: 0 8px 0 var(--ink); background: #fff;
  }

  /* crayons + replay */
  .tools { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; max-width: 560px; }
  .tools button {
    width: 58px; height: 58px; border-radius: 50%; border: 5px solid var(--ink);
    cursor: pointer; background: var(--c); box-shadow: 0 4px 0 var(--ink);
  }
  .tools button.on { outline: 5px solid var(--ink); outline-offset: 3px; }
  .tools .replay { background: #fff; font-size: 30px; line-height: 1; color: var(--ink); }

  /* ---------- The picture ---------- */
  /* container-type lets every size be measured in "cqi" (1cqi = 1% of the
     picture's width), so the same picture works big or as a tiny thumbnail.
     400 grid units = 100cqi, so 1 unit = 0.25cqi. */
  .stage {
    position: relative; width: 100%; aspect-ratio: 1;
    container-type: inline-size; background: #fff; overflow: hidden;
  }
  .stage > i {
    position: absolute;
    left:   calc((var(--cx) - var(--w) / 2) * .25cqi);
    top:    calc((var(--cy) - var(--h) / 2) * .25cqi);
    width:  calc(var(--w) * .25cqi);
    height: calc(var(--h) * .25cqi);
    border-radius: var(--r, 50%);
    rotate: var(--rot, 0deg);
  }

  /* A region = a white fill (::before) under a thick black outline (::after). */
  .r { cursor: pointer; }
  .r::before, .r::after { content: ''; position: absolute; inset: 0; border-radius: inherit; }
  .r::before { background: var(--fill, #fff); transition: background .25s; }
  .r::after  {
    border: 2cqi solid var(--ink);   /* 8 of 400 units: Keith's 8px outline */
    /* the outline is only shown where this pie slice reaches; animating
       --sweep from 0 to 360deg makes the outline draw itself around the shape */
    -webkit-mask: conic-gradient(from var(--from, 0deg), #000 var(--sweep), transparent 0);
            mask: conic-gradient(from var(--from, 0deg), #000 var(--sweep), transparent 0);
  }
  .r.bg::after { display: none; }      /* the sky has no outline */
  .r.flat::after { border-width: 2cqi 0 0 0; }   /* ground strips: just the top edge */

  .d    { background: var(--ink); pointer-events: none; }
  .d.w  { background: #fff; }
  .ln   { border: 2cqi solid transparent; border-bottom-color: var(--ink); pointer-events: none; }
  .ln.up { border-bottom-color: transparent; border-top-color: var(--ink); }   /* an upside-down curve */

  /* --sweep has to be a registered <angle> so the browser can animate it. */
  @property --sweep { syntax: '<angle>'; inherits: false; initial-value: 360deg; }

  /* ---------- The staggered build (only while .play is on) ---------- */
  /* timing: outline k starts at k x 110ms; fills start after the last outline;
     details (eyes, smiles) pop in after the last fill. --n = number of regions. */
  .play .r::after  { animation: trace .55s ease-in-out both; animation-delay: calc(var(--i) * 110ms); }
  .play .r::before { animation: fill-in .4s ease-out both;
                     animation-delay: calc(var(--n) * 110ms + 300ms + var(--i) * 55ms); }
  .play .d, .play .ln { animation: pop .4s cubic-bezier(.3, 1.7, .5, 1) both;
                        animation-delay: calc(var(--n) * 165ms + 600ms + var(--j) * 70ms); }

  @keyframes trace   { from { --sweep: 0deg; } to { --sweep: 360deg; } }
  @keyframes fill-in { from { opacity: 0; scale: .85; } to { opacity: 1; scale: 1; } }
  @keyframes pop     { from { scale: 0; } to { scale: 1; } }

  @media (prefers-reduced-motion: reduce) {
    .play .r::after, .play .r::before, .play .d, .play .ln { animation: none; }
  }
</style>
</head>
<body>

<div class="main">
  <div class="frame"><div class="stage" id="stage"></div></div>

<script>
  // The only JavaScript: number the shapes (the CSS uses the numbers for the
  // delays), show a picture, tap to color, and the crayons.
  const PICS = ['cat', 'frog', 'apple', 'pumpkin', 'car', 'balloon'];
  const COLORS = ['#ef476f', '#ff9f43', '#ffd166', '#06d6a0', '#118ab2', '#9b5de5', '#ff99c8', '#8d5a3b', '#fff'];
  const stage = document.getElementById('stage');
  let color = COLORS[0];

  function build(el, id) {
    el.replaceChildren(document.getElementById(id).content.cloneNode(true));
    let i = 0, j = 0;
    for (const s of el.children) {
      if (s.classList.contains('r')) s.style.setProperty('--i', i++);
      else s.style.setProperty('--j', j++);
    }
    el.style.setProperty('--n', i);
  }
  function show(id) {
    build(stage, id);
    stage.classList.remove('play'); void stage.offsetWidth; stage.classList.add('play');  // restart the build
    picker.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.id === id));
    stage.dataset.id = id;
  }

  // picker: a tiny, still copy of each picture
  for (const id of PICS) {
    const b = document.createElement('button'); b.dataset.id = id; b.ariaLabel = id;
    const mini = document.createElement('div'); mini.className = 'stage'; build(mini, id);
    b.append(mini); b.onclick = () => show(id); picker.append(b);
  }

  // crayons + a replay button
  for (const c of COLORS) {
    const b = document.createElement('button'); b.style.setProperty('--c', c); b.ariaLabel = 'color';
    b.onclick = () => { color = c; tools.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); };
    if (c === color) b.classList.add('on');
    tools.append(b);
  }
  const again = document.createElement('button'); again.className = 'replay'; again.textContent = '↻'; again.ariaLabel = 'replay';
  again.onclick = () => show(stage.dataset.id); tools.append(again);

  // tap a region to fill it
  stage.addEventListener('click', e => { const r = e.target.closest('.r'); if (r) r.style.setProperty('--fill', color); });

  show(PICS[0]);
</script>

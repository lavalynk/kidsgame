<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Coloring</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }

    /* Top bar: home on the left, arrows on the right */
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
    }
    .arrows { display: flex; gap: 14px; }

    /* The picture itself takes all the space it can */
    .stage {
      flex: 1;
      min-height: 0;
      display: grid;
      place-items: center;
      padding: 0 16px;
    }
    #picture {
      width: 100%;
      height: 100%;
      max-width: 640px;
      background: #fff;
      border: 6px solid var(--ink);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    /* Drawing styles for the animals */
    #picture .region {
      fill: #fff;
      stroke: var(--ink);
      stroke-width: 6;
      stroke-linejoin: round;
      cursor: pointer;
    }
    /* outline-only shape drawn on top to keep edges crisp (e.g. fish body over stripes) */
    #picture .outline { fill: none; stroke: var(--ink); stroke-width: 6; pointer-events: none; }
    #picture .ink   { fill: var(--ink); pointer-events: none; }
    #picture .shine { fill: #fff; pointer-events: none; }
    #picture .line  {
      fill: none; stroke: var(--ink); stroke-width: 6;
      stroke-linecap: round; pointer-events: none;
    }

    /* Bottom bar: crayons + undo/clear */
    .bottom {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px 16px;
    }
    .palette {
      flex: 1;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }
    .crayon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 5px solid var(--ink);
      cursor: pointer;
      padding: 0;
      box-shadow: var(--shadow);
      transition: transform 0.12s;
    }
    .crayon.selected {
      transform: scale(1.18) translateY(-6px);
      outline: 6px solid #fff;
      outline-offset: -14px;
    }
    .tools { display: flex; flex-direction: column; gap: 10px; }

    @media (max-width: 560px) {
      .crayon { width: 50px; height: 50px; border-width: 4px; }
      .round-btn { width: 64px; height: 64px; }
    }
  </style>
</head>
<body>
  <div class="top">
    <a class="round-btn" href="../index.html" aria-label="Home">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <path d="M6 24 L24 8 L42 24 M12 20 V40 H36 V20" fill="none" stroke="#2b2b2b"
              stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="20" y="28" width="8" height="12" fill="#ef476f"/>
      </svg>
    </a>
    <div class="arrows">
      <button class="round-btn" id="prev" aria-label="Previous animal">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path d="M30 8 L14 24 L30 40" fill="none" stroke="#2b2b2b" stroke-width="7"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button class="round-btn" id="next" aria-label="Next animal">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path d="M18 8 L34 24 L18 40" fill="none" stroke="#2b2b2b" stroke-width="7"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="stage">
    <svg id="picture" viewBox="0 0 400 400" role="img"></svg>
  </div>

  <div class="bottom">
    <div class="palette" id="palette"></div>
    <div class="tools">
      <button class="round-btn" id="undo" aria-label="Undo">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path d="M14 18 H30 A10 10 0 0 1 30 38 H18" fill="none" stroke="#2b2b2b"
                stroke-width="5" stroke-linecap="round"/>
          <path d="M20 10 L12 18 L20 26" fill="none" stroke="#2b2b2b" stroke-width="5"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button class="round-btn" id="clear" aria-label="Start over">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <!-- an eraser -->
          <path d="M8 30 L26 12 L40 26 L22 44 Z" fill="#ffafcc" stroke="#2b2b2b"
                stroke-width="4" stroke-linejoin="round"/>
          <path d="M15 23 L29 37" stroke="#2b2b2b" stroke-width="4"/>
        </svg>
      </button>
    </div>
  </div>

  <script src="animals.js"></script>
  <script src="coloring.js"></script>
</body>
</html>

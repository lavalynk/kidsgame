<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <!-- a real app: Add to Home Screen, full screen, works offline (see sw.js) -->
  <link rel="manifest" href="../manifest.webmanifest">
  <meta name="theme-color" content="#2a1e66">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kids Arcade">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <title>Parent corner</title>
  <link rel="stylesheet" href="../css/style.css?v=202611202053">
  <link rel="stylesheet" href="../arcade/shared.css?v=202611202053">
  <style>
    /* The Parent corner is for grown-ups: plain, calm, and it's fine to read here. */
    html, body { height: auto; min-height: 100%; overflow-x: hidden; overflow-y: auto; }
    html { background: #f4f1ea; }
    body { margin: 0; color: #2b2b2b; background: #f4f1ea; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; padding-bottom: 40px; }
    html.ar-phone body { padding: 3vh 4vw 40px; }
    .bar { display: flex; align-items: center; gap: 14px; padding: 14px 16px; max-width: 980px; margin: 0 auto; }
    .round { width: 64px; height: 64px; flex: none; border-radius: 50%; border: 4px solid #2b2b2b; background: #fff; display: grid; place-items: center;
      box-shadow: 0 5px 0 rgba(0,0,0,0.25); }
    .round svg { width: 38px; height: 38px; }
    h1 { margin: 0; font-size: clamp(24px, 5vw, 34px); }
    .sub { margin: 2px 0 0; font-size: 15px; color: #5d5d6b; }
    main { max-width: 980px; margin: 0 auto; padding: 0 16px; display: grid; gap: 16px; }
    .card { background: #fff; border: 3px solid #2b2b2b; border-radius: 20px; padding: 16px 18px; box-shadow: 0 5px 0 rgba(0,0,0,0.15); }
    .card h2 { margin: 0 0 10px; font-size: 22px; display: flex; align-items: center; gap: 12px; }
    .card h2 .av { width: 56px; height: 56px; border-radius: 50%; overflow: hidden; border: 3px solid #2b2b2b; flex: none; }
    .card h2 .av svg { width: 100%; height: 100%; display: block; }
    .card h2 small { font-size: 14px; font-weight: 600; color: #5d5d6b; }
    .facts { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
    .fact { background: #f4f1ea; border-radius: 14px; padding: 8px 14px; min-width: 110px; }
    .fact b { display: block; font-size: 24px; }
    .fact span { font-size: 13px; color: #5d5d6b; }
    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    @media (max-width: 700px) { .cols { grid-template-columns: 1fr; } }
    h3 { margin: 0 0 6px; font-size: 15px; text-transform: uppercase; letter-spacing: 0.5px; color: #5d5d6b; }
    /* the last 7 days: a small bar chart */
    .week { display: flex; align-items: flex-end; gap: 6px; height: 120px; }
    .week .d { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; font-size: 12px; color: #5d5d6b; }
    .week .d i { display: block; width: 100%; max-width: 40px; background: #9b5de5; border-radius: 6px 6px 0 0; min-height: 2px; }
    .week .d.today i { background: #06d6a0; }
    .week .d b { font-size: 12px; color: #2b2b2b; }
    /* which games: name, a bar, minutes */
    .games { display: grid; gap: 5px; }
    .games .g { display: grid; grid-template-columns: minmax(90px, 150px) 1fr 54px; align-items: center; gap: 8px; font-size: 15px; }
    .games .g i { display: block; height: 14px; border-radius: 7px; background: var(--c, #9b5de5); border: 2px solid #2b2b2b; min-width: 6px; box-sizing: border-box; }
    .games .g span:last-child { text-align: right; font-variant-numeric: tabular-nums; }
    .none { color: #5d5d6b; font-size: 15px; }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-top: 12px; padding-top: 12px; border-top: 2px dashed #d8d3c8; }
    .row label { font-weight: 700; display: flex; align-items: center; gap: 8px; min-height: 48px; }
    select, .btn { font: inherit; font-weight: 700; min-height: 48px; padding: 6px 14px; border-radius: 12px; border: 3px solid #2b2b2b; background: #fff; color: #2b2b2b; cursor: pointer; }
    .btn.on { background: #06d6a0; }
    .btn.warn { background: #ffd6d6; }
    .btn.main { background: #ffd166; }
    input[type=range] { width: 160px; height: 40px; accent-color: #9b5de5; }
    input[type=checkbox] { width: 26px; height: 26px; accent-color: #06d6a0; }
    .hint { font-size: 14px; color: #5d5d6b; margin: 6px 0 0; }
    .private { background: #e8f8f1; border-color: #1b7f5a; }
    .private p { margin: 0; font-size: 16px; }
    /* the door: shown when someone opens this page without holding the button */
    .door { min-height: 70vh; display: grid; place-items: center; text-align: center; }
    .door p { font-size: 18px; margin: 0 0 14px; }
  </style>
</head>
<body>
  <div class="bar">
    <a class="round" href="../index.html" aria-label="Back to the arcade" id="home"></a>
    <div><h1>Parent corner</h1><p class="sub">For grown-ups. Everything here stays on this device.</p></div>
  </div>
  <main id="main"></main>
  <script src="../arcade/gsap.min.js?v=202611202053"></script>  <!-- GSAP: bouncy menu animations (arcade/LIBRARIES.md) -->
  <script src="../arcade/shared.js?v=202611202053"></script>
  <script src="../arcade/stickers.js?v=202611202053"></script>
  <script src="../arcade/daily.js?v=202611202053"></script>  <!-- the daily surprise -->
  <script src="../arcade/parent.js?v=202611202053"></script>  <!-- play time + time limit (the Parent corner) -->
  <script src="parent.js?v=202611202053"></script>
</body>
</html>

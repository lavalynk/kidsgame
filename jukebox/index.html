<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <!-- a real app: Add to Home Screen, full screen, works offline (see sw.js) -->
  <link rel="manifest" href="../manifest.webmanifest">
  <meta name="theme-color" content="#2a1e66">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kids Arcade">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <title>Jukebox</title>
  <link rel="stylesheet" href="../css/style.css?v=202611271340">
  <!-- (Nov 24, plan point 9: start fetching the two menu fonts right away, not after the big scripts;
       only from a web address: a page opened from the disk can't preload fonts) -->
  <script>if (/^http/.test(location.protocol)) for (const f of ['LilitaOne', 'Fredoka-600']) document.write('<link rel="preload" href="../arcade/fonts/' + f + '.woff2" as="font" type="font/woff2" crossorigin>');</script>
  <link rel="stylesheet" href="../arcade/shared.css?v=202611271340">
  <style>
    /* The Jukebox: every song in the arcade + a dancing friend + drum pads.
       Phaser draws the page (body.cm, see jukebox.js); the HTML below is only the fallback without it. */
    html, body { height: 100%; overflow: hidden; }
    html, body { background: #2a1e66; }
    body { margin: 0; color: #fff; font-family: 'Trebuchet MS', Arial, sans-serif; }
    .fallback { padding: 20px; display: flex; flex-wrap: wrap; gap: 12px; overflow-y: auto; height: 100%; box-sizing: border-box; align-content: flex-start; }
    .fallback button { width: 90px; height: 90px; border-radius: 20px; border: 4px solid #2b2b2b; padding: 6px; cursor: pointer; }
    .fallback button svg { width: 100%; height: 100%; }
    body.cm .fallback { display: none; }
  </style>
</head>
<body>
  <div class="fallback" id="fallback"></div>
  <script src="../arcade/gsap.min.js?v=202611271340"></script>  <!-- GSAP: bouncy menu animations (arcade/LIBRARIES.md) -->
  <script src="../arcade/shared.js?v=202611271340"></script>
  <script src="../arcade/stickers.js?v=202611271340"></script>
  <script src="../arcade/daily.js?v=202611271340"></script>  <!-- the daily surprise -->
  <script src="../arcade/parent.js?v=202611271340"></script>  <!-- play time + time limit (the Parent corner) -->
  <script src="../arcade/badges.js?v=202611271340"></script>  <!-- the games' round pictures -->
  <script src="../arcade/phaser.min.js?v=202611271340"></script>  <!-- Phaser 3: draws the page (arcade/LIBRARIES.md) -->
  <script src="../arcade/rexui.min.js?v=202611271340"></script>  <!-- Rex UI: buttons, grids and scrolling panels for Phaser -->
  <script src="../arcade/canvasmenu.js?v=202611271340"></script>  <!-- the menus, drawn by Phaser (arcade/canvasmenu.js) -->
  <script src="songs.js?v=202611271340"></script>  <!-- every song in the arcade (made by tools/make_jukebox.py) -->
  <script src="jukebox.js?v=202611271340"></script>
</body>
</html>

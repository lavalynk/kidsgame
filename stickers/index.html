<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <!-- a real app: Add to Home Screen, full screen, works offline (see sw.js) -->
  <link rel="manifest" href="../manifest.webmanifest">
  <meta name="theme-color" content="#2a1e66">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kids Arcade">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <title>Sticker Book</title>
  <link rel="stylesheet" href="../css/style.css?v=202611070830">
  <link rel="stylesheet" href="../arcade/shared.css?v=202611070830">
  <style>
    /* The sticker book: one page (a colored card) per game, 4 sticker spots on each */
    html, body { height: auto; min-height: 100%; overflow-x: hidden; overflow-y: auto; }
    html { background: #3b2a7a; }
    body { color: #fff; background: radial-gradient(circle at 50% 0%, #6a4fd0 0, #3b2a7a 55%, #22184f 100%); background-attachment: fixed; padding-bottom: 30px; }
    html.ar-phone body { padding: 5vh 5vw; }
    .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; max-width: 1180px; margin: 0 auto; }
    .round { width: 72px; height: 72px; flex: none; border-radius: 50%; border: 5px solid var(--ink); background: #fff; display: grid; place-items: center;
      box-shadow: 0 6px 0 rgba(0,0,0,0.35); cursor: pointer; padding: 0; -webkit-tap-highlight-color: transparent; }
    .round svg { width: 44px; height: 44px; }
    .round:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.35); }
    h1 { margin: 0; display: flex; align-items: center; gap: 10px; font-family: 'Lilita One', 'Arial Black', sans-serif; font-weight: 400;
      font-size: clamp(26px, 6vw, 44px); letter-spacing: 1px; color: #ffd166; text-shadow: 3px 3px 0 #2b2b2b, -2px -2px 0 #2b2b2b, 2px -2px 0 #2b2b2b, -2px 2px 0 #2b2b2b; }
    h1 svg { width: 1.3em; height: 1.3em; filter: drop-shadow(2px 3px 0 rgba(0,0,0,0.35)); }
    .count { display: flex; align-items: center; gap: 6px; background: #fff; color: var(--ink); border: 5px solid var(--ink); border-radius: 999px;
      padding: 4px 16px 4px 6px; font-weight: 900; font-size: 22px; box-shadow: 0 6px 0 rgba(0,0,0,0.35); }
    .count svg { width: 46px; height: 46px; }
    .count { white-space: nowrap; }
    @media (max-width: 480px) { .count { font-size: 17px; padding-right: 10px; } .count svg { width: 34px; height: 34px; } .round { width: 62px; height: 62px; } h1 span { display: none; } }
    .meter { max-width: 640px; height: 22px; margin: 4px auto 14px; border: 4px solid var(--ink); border-radius: 999px; background: rgba(255,255,255,0.2); overflow: hidden; }
    .meter div { height: 100%; background: linear-gradient(90deg, #ff5fa2, #ffd166, #06d6a0); }

    .book { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 520px), 1fr)); gap: 16px; padding: 0 16px; max-width: 1180px; margin: 0 auto; }
    .page { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border: 5px solid var(--ink); border-radius: 26px;
      background: var(--c); box-shadow: 0 7px 0 rgba(0,0,0,0.35); }
    .page .gm { width: 74px; height: 74px; flex: none; border-radius: 50%; overflow: hidden; border: 5px solid var(--ink); background: #fff; cursor: pointer; padding: 0; }
    .page .gm svg { width: 100%; height: 100%; display: block; }
    .slots { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .slot { position: relative; aspect-ratio: 1; max-width: 104px; width: 100%; justify-self: center; padding: 0; border: 0; background: none;
      border-radius: 22px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .slot > svg { width: 100%; height: 100%; display: block; transition: transform 0.15s; }
    .slot:hover > svg { transform: scale(1.08) rotate(-4deg); }
    .slot .hint { position: absolute; right: -4px; bottom: -4px; width: 40%; height: 40%; background: #fff; border: 3px solid var(--ink); border-radius: 50%;
      display: grid; place-items: center; }
    .slot .hint svg { width: 78%; height: 78%; }
    .slot.new > svg { animation: wig 0.6s ease-in-out infinite alternate; }
    .slot.new::after { content: ''; position: absolute; top: -8px; right: -8px; width: 30px; height: 30px; border-radius: 50%;
      background: #ff5fa2 radial-gradient(circle, #fff 0 4px, transparent 5px); border: 3px solid var(--ink); }
    @keyframes wig { from { transform: rotate(-6deg) scale(1.02); } to { transform: rotate(6deg) scale(1.1); } }
    @media (max-width: 560px) { .page { flex-direction: column; } .page .gm { width: 60px; height: 60px; } }
    @media (prefers-reduced-motion: reduce) { .slot.new > svg { animation: none; } }

    /* one sticker, big */
    .zoom { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; background: rgba(21,14,56,0.82); }
    .zoom[hidden] { display: none; }
    .zoom .card { position: relative; background: #fff8e6; color: var(--ink); border: 6px solid var(--ink); border-radius: 30px; padding: 18px 22px;
      text-align: center; width: min(420px, 100%); box-shadow: 0 12px 0 rgba(0,0,0,0.4); animation: pop 0.3s cubic-bezier(.3,1.6,.5,1); }
    @keyframes pop { from { transform: scale(0.6) rotate(-6deg); } }
    .zoom .big { width: min(220px, 50vh); height: min(220px, 50vh); margin: 0 auto; display: block; }
    .zoom .big.locked { background: var(--c); border-radius: 30px; border: 5px solid var(--ink); }
    .zoom h2 { margin: 6px 0; font-family: 'Lilita One', 'Arial Black', sans-serif; font-weight: 400; font-size: 32px; letter-spacing: 1px; }
    .zoom .how { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 8px 0; }
    .zoom .how > svg { width: 64px; height: 64px; }
    .zoom .how .gm { width: 64px; height: 64px; border-radius: 50%; overflow: hidden; border: 4px solid var(--ink); }
    .zoom .how .gm svg { width: 100%; height: 100%; display: block; }
    .zoom .row { display: flex; justify-content: center; gap: 12px; margin-top: 8px; }
    .zoom .row .round.go { background: var(--ar-green); width: 84px; height: 84px; }
    html.ar-phone .zoom { padding: 5vh 5vw; }
  </style>
</head>
<body>
  <div class="bar">
    <a class="round" id="home" href="../index.html" aria-label="Back to the arcade"></a>
    <h1 id="title"></h1>
    <div class="count" id="count"></div>
  </div>
  <div class="meter"><div id="meter"></div></div>
  <main class="book" id="book"></main>
  <div class="zoom" id="zoom" hidden><div class="card" id="card"></div></div>

  <script src="../arcade/shared.js?v=202611070830"></script>
  <script src="../arcade/stickers.js?v=202611070830"></script>
  <script src="../arcade/badges.js?v=202611070830"></script>
  <script src="book.js?v=202611070830"></script>
</body>
</html>

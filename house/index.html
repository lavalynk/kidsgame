<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <!-- a real app: Add to Home Screen, full screen, works offline (see sw.js) -->
  <link rel="manifest" href="../manifest.webmanifest">
  <meta name="theme-color" content="#2a1e66">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kids Arcade">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <title>My House</title>
  <link rel="stylesheet" href="../css/style.css?v=202611130400">
  <link rel="stylesheet" href="../arcade/shared.css?v=202611130400">
  <style>
    /* My House: the room on top (or on the left when the screen is wide), the shop below it */
    body { display: flex; flex-direction: column; height: 100dvh; background: radial-gradient(circle at 50% 0%, #ffe8a3 0, #ffc8dd 60%, #c77dff 100%); }
    html.ar-phone body { padding: 5vh 5vw; }
    .bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 12px; flex: none; }
    .round { width: 70px; height: 70px; flex: none; border-radius: 50%; border: 5px solid var(--ink); background: #fff; display: grid; place-items: center;
      box-shadow: 0 6px 0 rgba(0,0,0,0.3); padding: 0; -webkit-tap-highlight-color: transparent; }
    .round svg { width: 42px; height: 42px; }
    .coins { display: flex; align-items: center; gap: 6px; background: #fff; border: 5px solid var(--ink); border-radius: 999px; padding: 4px 18px 4px 6px;
      font-weight: 900; font-size: 30px; box-shadow: 0 6px 0 rgba(0,0,0,0.3); }
    .coins svg { width: 48px; height: 48px; }
    .coins.shake { animation: shake 0.4s; }
    @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
    /* "win trophies to get coins" picture, shown when you can't afford something */
    .how { position: fixed; left: 50%; top: 45%; transform: translate(-50%, -50%) scale(0); z-index: 40; display: flex; align-items: center; gap: 10px;
      background: #fff; border: 6px solid var(--ink); border-radius: 30px; padding: 16px 22px; box-shadow: 0 10px 0 rgba(0,0,0,0.3); transition: transform 0.3s cubic-bezier(.3,1.6,.5,1); }
    .how.show { transform: translate(-50%, -50%) scale(1); }
    .how svg { width: 72px; height: 72px; }
    .main { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; padding: 0 12px 12px; }
    .room { flex: 1; min-height: 0; min-width: 0; display: grid; place-items: center; container-type: size; }
    .room > svg { width: min(100cqw, 160cqh, 900px); height: auto; aspect-ratio: 8 / 5; display: block; border: 6px solid var(--ink); border-radius: 26px; background: #fff; box-shadow: 0 8px 0 rgba(0,0,0,0.25); }
    .room .trying { animation: wiggle 0.5s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
    @keyframes wiggle { from { transform: rotate(-1.5deg) scale(0.98); } to { transform: rotate(1.5deg) scale(1.02); } }
    .room .me { cursor: pointer; transform-box: fill-box; transform-origin: bottom center; }
    .room .me.hop { animation: hop 0.5s ease-out; }
    @keyframes hop { 40% { transform: translateY(-40px) scaleY(1.05); } 70% { transform: translateY(0) scaleY(0.92); } }
    .side { flex: none; display: flex; flex-direction: column; gap: 8px; }
    .tabs, .shop { display: flex; gap: 8px; overflow-x: auto; padding: 4px 4px 10px; scrollbar-width: thin; }
    .tab { flex: none; width: 70px; height: 70px; padding: 4px; border: 4px solid var(--ink); border-radius: 18px; background: #fff; box-shadow: 0 4px 0 rgba(0,0,0,0.25); }
    .tab svg { width: 100%; height: 100%; display: block; border-radius: 10px; }
    .tab.on { background: #ffd166; box-shadow: 0 0 0 4px #ffd166, 0 4px 0 4px rgba(0,0,0,0.25); }
    .item { position: relative; flex: none; width: 96px; height: 96px; padding: 6px; border: 5px solid var(--ink); border-radius: 22px; background: #fff;
      box-shadow: 0 5px 0 rgba(0,0,0,0.25); -webkit-tap-highlight-color: transparent; }
    .item > svg { width: 100%; height: 100%; display: block; border-radius: 12px; }
    .item.on { background: #c7f9cc; box-shadow: 0 0 0 5px #06d6a0, 0 5px 0 5px rgba(0,0,0,0.25); }
    .item.try { background: #fff6c2; box-shadow: 0 0 0 5px #ffd166, 0 5px 0 5px rgba(0,0,0,0.25); }
    .item.poor > svg { opacity: 0.55; }
    .item .tag { position: absolute; left: -6px; bottom: -8px; display: flex; align-items: center; gap: 2px; background: #fff; border: 3px solid var(--ink);
      border-radius: 999px; padding: 0 8px 0 2px; font-weight: 900; font-size: 18px; }
    .item .tag svg { width: 26px; height: 26px; }
    .item .tag.own { padding: 2px; background: #06d6a0; } .item .tag.own svg { width: 20px; height: 20px; }
    .item .buy { position: absolute; right: -10px; top: -10px; width: 46px; height: 46px; border-radius: 50%; background: #06d6a0; border: 4px solid var(--ink);
      display: grid; place-items: center; animation: pulse 0.8s ease-in-out infinite; }
    .item .buy svg { width: 30px; height: 30px; }
    @keyframes pulse { 50% { transform: scale(1.15); } }
    /* tall screens (phones upright): all the spot buttons wrap onto a few rows */
    @media (max-aspect-ratio: 4/3) {
      .tabs, .shop { flex-wrap: wrap; justify-content: center; overflow: visible; }
      .tab { width: 62px; height: 62px; border-radius: 16px; border-width: 3px; padding: 3px; } .tabs { gap: 6px; }
      .item { width: 84px; height: 84px; }
    }
    /* wide screens (tablets, phones sideways): room on the left, shop on the right */
    @media (min-aspect-ratio: 4/3) {
      .main { flex-direction: row; }
      .side { width: min(330px, 38vw); min-height: 0; }
      .tabs { flex-wrap: wrap; overflow: visible; flex: none; }
      .shop { flex-wrap: wrap; overflow-y: auto; align-content: flex-start; flex: 1; }
    }
    @media (min-aspect-ratio: 4/3) and (max-height: 520px) {
      .bar { padding: 2px 8px; } .round { width: 58px; height: 58px; } .rm { width: 58px; height: 58px; padding: 4px; border-width: 4px; } .coins { font-size: 24px; } .coins svg { width: 38px; height: 38px; }
      .tab { width: 50px; height: 50px; border-radius: 14px; border-width: 3px; } .tabs { gap: 5px; }
      .item { width: 76px; height: 76px; }
    }
    @media (prefers-reduced-motion: reduce) { .room .trying, .item .buy { animation: none; } }

    /* the 4 rooms: Bedroom, Garden, Garage, Art Room (picture buttons in the top bar) */
    .rooms { display: flex; gap: 8px; }
    .rm { width: 70px; height: 70px; padding: 6px; border: 5px solid var(--ink); border-radius: 20px; background: #fff; box-shadow: 0 5px 0 rgba(0,0,0,0.3); -webkit-tap-highlight-color: transparent; }
    .rm svg { width: 100%; height: 100%; display: block; }
    .rm.on { background: #ffd166; box-shadow: 0 0 0 4px #ffd166, 0 5px 0 4px rgba(0,0,0,0.3); }
    .bar .right { display: flex; align-items: center; gap: 10px; }
    .fbtn { position: relative; cursor: pointer; }
    .fbtn.on { background: #c7f9cc; }
    .fbtn .bub { position: absolute; right: -8px; top: -8px; min-width: 30px; height: 30px; border-radius: 15px; background: #ff5fa2; color: #fff; border: 3px solid var(--ink);
      font-weight: 900; font-size: 17px; display: grid; place-items: center; }
    /* moving things: drag anything in the room */
    .room { position: relative; }
    .room > svg { touch-action: none; }
    .room [data-drag] { cursor: grab; }
    .room .lift { filter: drop-shadow(0 10px 6px rgba(0,0,0,0.35)); cursor: grabbing; }
    /* putting things away: the toy box in the corner while dragging */
    .room .lift.away { opacity: 0.5; }
    .room .poof { transition: opacity 0.3s; opacity: 0 !important; }
    .room .awaybox { animation: ar-pop 0.25s; transform-box: fill-box; transform-origin: center; }
    .room .awaybox.on > rect { fill: #ffd6e0; stroke: #ef476f; opacity: 1; }
    .room .awaybox.on { animation: box-wiggle 0.4s ease-in-out infinite alternate; }
    .room .awaybox.gulp { animation: box-gulp 0.3s ease-out; }
    @keyframes box-wiggle { from { transform: rotate(-4deg) scale(1.06); } to { transform: rotate(4deg) scale(1.1); } }
    @keyframes box-gulp { 50% { transform: scale(1.25); } }
    /* visiting a friend: their face + "back to my house" over the room; no shop */
    .visit { position: absolute; left: 50%; top: 6px; transform: translateX(-50%); z-index: 5; display: flex; align-items: center; gap: 10px;
      background: #fff8e6; border: 5px solid var(--ink); border-radius: 999px; padding: 4px; box-shadow: 0 6px 0 rgba(0,0,0,0.3); }
    .visit[hidden] { display: none; }
    .visit .fav, .fpanel .fav { width: 64px; height: 64px; border-radius: 50%; overflow: hidden; border: 4px solid var(--ink); display: block; }
    .visit .fav svg, .fpanel .fav svg { width: 100%; height: 100%; display: block; }
    .visit .round { width: 64px; height: 64px; box-shadow: none; cursor: pointer; }
    body.visiting .side, body.visiting .coins { display: none; }
    /* the Friends window */
    .ov { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; background: rgba(21,14,56,0.8); overflow-y: auto; }
    .ov[hidden] { display: none; }
    html.ar-phone .ov { padding: 5vh 5vw; }
    .fpanel { width: min(560px, 100%); background: #fff8e6; border: 6px solid var(--ink); border-radius: 30px; padding: 16px; text-align: center; box-shadow: 0 12px 0 rgba(0,0,0,0.4); }
    .fbig svg { width: 90px; height: 90px; }
    .frow { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 14px; margin: 12px 0 4px; }
    .ftile { min-width: 180px; min-height: 120px; border: 5px solid var(--ink); border-radius: 24px; background: #fff; cursor: pointer; box-shadow: 0 6px 0 rgba(0,0,0,0.3); display: grid; place-items: center; }
    .fpanel .fav { width: 92px; height: 92px; position: relative; overflow: visible; background: none; padding: 0; cursor: pointer; }
    .fpanel .fav > svg { border-radius: 50%; }
    .fpanel button.fav { animation: ar-pop 0.3s; box-shadow: 0 6px 0 rgba(0,0,0,0.3); border-radius: 50%; }
    .fpanel .fav.me { opacity: 0.8; }
    .fpanel .fav .go { position: absolute; right: -10px; bottom: -10px; width: 44px; height: 44px; border-radius: 50%; background: #06d6a0; border: 4px solid var(--ink); display: grid; place-items: center; }
    .fpanel .fav .go svg { width: 28px; height: 28px; }
    .fpanel .wait svg { width: 70px; height: 70px; animation: ar-tap 1s ease-in-out infinite; }
    .fpanel .round { cursor: pointer; }
    .fpanel .round.leave { background: #ffd6e0; }
    /* phones upright: the 4 room buttons get their own row under the bar */
    @media (max-width: 600px) {
      .bar { flex-wrap: wrap; row-gap: 6px; }
      .rooms { order: 3; width: 100%; justify-content: center; }
      .rm { width: 64px; height: 64px; border-width: 4px; border-radius: 16px; }
      .round { width: 62px; height: 62px; } .round svg { width: 38px; height: 38px; }
      .coins { font-size: 24px; padding-right: 12px; } .coins svg { width: 38px; height: 38px; }
    }
  </style>
</head>
<body>
  <div class="bar">
    <a class="round" id="home" href="../index.html" aria-label="Back to the arcade"></a>
    <div class="rooms" id="rooms"></div>
    <div class="right">
      <button type="button" class="round fbtn" id="fbtn" aria-label="Friends"></button>
      <div class="coins" id="coins" aria-label="Coins"></div>
    </div>
  </div>
  <div class="main">
    <div class="room" id="room"><div class="visit" id="visit" hidden></div></div>
    <div class="side">
      <div class="tabs" id="tabs"></div>
      <div class="shop" id="shop"></div>
    </div>
  </div>
  <div class="how" id="how" aria-label="Win trophies to get coins"></div>
  <div class="ov" id="friends" hidden><div class="fpanel" id="fpanel"></div></div>

  <script src="../arcade/shared.js?v=202611130400"></script>
  <script src="../arcade/stickers.js?v=202611130400"></script>
  <script src="../arcade/daily.js?v=202611130400"></script>  <!-- the daily surprise -->
  <script src="../arcade/net.js?v=202611130400"></script>  <!-- visiting friends -->
  <!-- the coloring pages + render.js: your pictures hang in the Art Room -->
  <script src="../coloring/animals.js?v=202611130400"></script>
  <script src="../coloring/fruit.js?v=202611130400"></script>
  <script src="../coloring/things.js?v=202611130400"></script>
  <script src="../coloring/render.js?v=202611130400"></script>
  <script src="house.js?v=202611130400"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <!-- a real app: Add to Home Screen, full screen, works offline (see sw.js) -->
  <link rel="manifest" href="../manifest.webmanifest">
  <meta name="theme-color" content="#2a1e66">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kids Arcade">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <title>Maze</title>
  <link rel="stylesheet" href="../css/style.css?v=202611210623">
  <style>
    body { display: flex; flex-direction: column; height: 100dvh; }

    /* Top bar: home on the left, "new maze" on the right */
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
    }

    /* The maze takes all the space it can, always a square */
    .stage {
      flex: 1;
      min-height: 0;
      display: grid;
      place-items: center;
      padding: 0 16px 16px;
      container-type: size;
    }
    #maze {
      width: min(100cqw, 100cqh);
      height: min(100cqw, 100cqh);
      touch-action: none;        /* dragging moves the character, not the page */
      overflow: visible;
    }

    /* Maze drawing */
    .shape    { stroke: var(--ink); stroke-width: 1.4; stroke-linejoin: round; }
    .path-out { fill: none; stroke: var(--ink); stroke-linecap: round; stroke-linejoin: round; }
    .path-in  { fill: none; stroke: #fff;       stroke-linecap: round; stroke-linejoin: round; }
    .trail    { fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: 0.85; }

    /* The character slides smoothly from spot to spot */
    #hero { transition: transform 0.12s ease-out; cursor: grab; }
    #hero.wiggle-me > .anim { animation: hint 1.6s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes hint { 0%, 70%, 100% { transform: scale(1); } 80% { transform: scale(1.18); } 90% { transform: scale(0.95); } }
    #goal > .anim { animation: bob 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes bob { 50% { transform: translateY(-6%) rotate(6deg); } }

    /* Winning: the character hops, stars fly out */
    #hero.happy > .anim { animation: hop 0.5s ease-in-out 3; transform-box: fill-box; transform-origin: bottom; }
    @keyframes hop { 50% { transform: translateY(-30%) scale(1.15); } }
    .burst { animation: fly 1.1s ease-out forwards; transform-box: fill-box; transform-origin: center; }
    @keyframes fly {
      from { transform: translate(0, 0) scale(0.3) rotate(0deg); opacity: 1; }
      to   { transform: translate(var(--dx), var(--dy)) scale(1.2) rotate(200deg); opacity: 0; }
    }

    .top .mid { display: flex; gap: 12px; }
    /* small phones upright (Nov 20): 4 round buttons in a row didn't fit */
    @media (max-width: 400px) {
      .top { padding: 8px 4px; }
      .top .round-btn { width: 60px; height: 60px; } .top .round-btn svg { width: 36px; height: 36px; }
      .top .mid { gap: 6px; }
    }
    body { transition: background 0.4s; }
    /* key and gems gently bob */
    .bob > .anim { animation: bob 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .door { transition: opacity 0.6s; }
    /* the "show me" path: a sparkly dashed line */
    .hint { fill: none; stroke: #ffd166; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 0.1 3.2;
            animation: hintmove 0.6s linear infinite; filter: drop-shadow(0 0 1.2px #fff); }
    @keyframes hintmove { to { stroke-dashoffset: -3.3; } }
    /* stars earned, shown above the next arrow */
    .winstars { position: fixed; left: 50%; bottom: calc(8vh + 130px); transform: translateX(-50%); display: none; gap: 8px; z-index: 5; }
    .winstars.show { display: flex; }
    .winstars svg { width: 64px; height: 64px; }
    .winstars svg.on { animation: starpop 0.5s cubic-bezier(.3, 1.8, .5, 1) both; }
    .winstars svg.medal { width: 80px; height: 80px; }
    @keyframes starpop { from { transform: scale(0) rotate(-90deg); } }

    /* Big "next maze" arrow that appears after a win */
    #next {
      position: fixed;
      left: 50%; bottom: 8vh;
      width: 120px; height: 120px;
      margin-left: -60px;
      border-radius: 50%;
      background: #06d6a0;
      display: none;
      animation: pulse 1s ease-in-out infinite;
    }
    #next svg { width: 70px; height: 70px; }
    #next.show { display: grid; }
    @keyframes pulse { 50% { transform: scale(1.1); } }
    /* "stuck?" nudge: the bulb wiggles */
    #hint.nudge { animation: nudge 0.9s ease-in-out 3; }
    @keyframes nudge { 25% { transform: rotate(-12deg) scale(1.1); } 75% { transform: rotate(12deg) scale(1.1); } }
    /* dark caves */
    .fog { fill: #1b1630; opacity: 0.9; pointer-events: none; }
    #goal.glow > .anim { filter: drop-shadow(0 0 2px #ffe58a) drop-shadow(0 0 4px #ffe58a); }
    .winstars svg.newfriend { width: 84px; height: 84px; }

    /* The map: a full-screen picture page */
    .map { position: fixed; inset: 0; z-index: 20; display: none; flex-direction: column; gap: 14px;
           padding: 12px 16px 24px; background: #fff7e6; overflow-y: auto; }
    html.ar-phone .map { padding: 5vh 5vw; }
    html.ar-phone .maptop { top: -5vh; margin-top: -5vh; padding-top: 5vh; }
    .map.show { display: flex; }
    .map > * { flex-shrink: 0; }   /* the page scrolls instead of squashing the stones */
    .maptop { display: flex; justify-content: space-between; align-items: center;
              position: sticky; top: -12px; z-index: 2; background: #fff7e6; margin: -12px -4px 0; padding: 12px 4px 8px; }
    .buddies { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    .buddies .pick { width: 84px; height: 84px; border-radius: 50%; border: 5px solid var(--ink); background: #fff;
                     padding: 6px; cursor: pointer; box-shadow: var(--shadow); }
    .buddies .pick svg { width: 100%; height: 100%; }
    .buddies .pick.on { background: #ffe066; outline: 6px solid #06d6a0; outline-offset: 2px; }
    .buddies .pick.locked { background: #e8e2d4; }
    .buddies .pick.locked .art { filter: brightness(0) opacity(0.3); }
    .stones { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; padding-top: 8px;
              border-top: 5px dashed #e0d4b8; }
    .stone { width: 96px; height: 116px; border-radius: 24px; border: 5px solid var(--ink); cursor: pointer;
             display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
             padding: 6px; box-shadow: var(--shadow); }
    .stone .sh { width: 62px; height: 62px; }
    .stone .st { width: 72px; height: 22px; }
    .stone.here { outline: 6px solid #ef476f; outline-offset: 3px; animation: pulse 1.2s ease-in-out infinite; }

    /* phones: use 90% of the screen, a 5% border all round (Keith) */
    html.ar-phone body { padding: 5vh 5vw; }
  </style>
</head>
<body>
  <div class="top">
    <a class="round-btn" href="../index.html" aria-label="Home">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <path d="M6 24 L24 8 L42 24 M12 20 V40 H36 V20" fill="none" stroke="#2b2b2b"
              stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="20" y="28" width="8" height="12" fill="#ef476f"/>
      </svg>
    </a>
    <div class="mid">
      <button class="round-btn" id="hint" aria-label="Show me the way">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <!-- a light bulb -->
          <path d="M24 6 C14 6 9 13 9 20 C9 27 15 30 16 36 H32 C33 30 39 27 39 20 C39 13 34 6 24 6 Z" fill="#ffd166" stroke="#2b2b2b" stroke-width="4" stroke-linejoin="round"/>
          <path d="M18 41 H30" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round"/>
          <path d="M20 22 Q24 17 28 22" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </button>
      <button class="round-btn" id="mapBtn" aria-label="Map: friends and all mazes">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <!-- a folded treasure map with a dotted path -->
          <path d="M5 11 L17 6 L31 11 L43 6 V37 L31 42 L17 37 L5 42 Z" fill="#fff1c1" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round"/>
          <path d="M17 6 V37 M31 11 V42" stroke="#2b2b2b" stroke-width="2.5"/>
          <path d="M10 33 Q16 22 24 26 T37 15" fill="none" stroke="#ef476f" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 5"/>
          <path d="M33 11 L41 19 M41 11 L33 19" stroke="#ef476f" stroke-width="3.5" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <button class="round-btn" id="shuffle" aria-label="A different maze">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <!-- circling arrow = "another one" -->
        <path d="M38 24 A14 14 0 1 1 30 11" fill="none" stroke="#2b2b2b" stroke-width="5"
              stroke-linecap="round"/>
        <path d="M24 6 L33 11 L26 19" fill="none" stroke="#2b2b2b" stroke-width="5"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <div class="stage">
    <svg id="maze" viewBox="-4 -4 108 108" role="img" aria-label="Maze"></svg>
  </div>

  <button class="round-btn" id="next" aria-label="Next maze">
    <svg viewBox="0 0 48 48" aria-hidden="true">
      <path d="M18 8 L34 24 L18 40" fill="none" stroke="#2b2b2b" stroke-width="7"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <div id="winStars" class="winstars"></div>

  <!-- The map (Nov 19): pick a friend, Easy/Normal/Challenge, and every maze so far -->
  <div id="map" class="map">
    <div class="maptop">
      <button class="round-btn" id="mapClose" aria-label="Back to the maze">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path d="M30 8 L14 24 L30 40" fill="none" stroke="#2b2b2b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button class="round-btn" id="diff" aria-label="Difficulty"></button>
    </div>
    <div id="buddies" class="buddies"></div>
    <div id="stones" class="stones"></div>
  </div>
  <script src="../arcade/gsap.min.js?v=202611210623"></script>  <!-- GSAP: bouncy menu animations (arcade/LIBRARIES.md) -->
  <script src="../arcade/shared.js?v=202611210623"></script> <!-- only for saving progress to the arcade -->
  <script src="../arcade/stickers.js?v=202611210623"></script>  <!-- the sticker book -->
  <script src="../arcade/daily.js?v=202611210623"></script>  <!-- the daily surprise -->
  <script src="../arcade/parent.js?v=202611210623"></script>  <!-- play time + time limit (the Parent corner) -->
  <script src="maze.js?v=202611210623"></script>
</body>
</html>

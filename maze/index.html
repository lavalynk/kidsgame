<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <!-- a real app: Add to Home Screen, full screen, works offline (see sw.js) -->
  <link rel="manifest" href="../manifest.webmanifest">
  <meta name="theme-color" content="#2a1e66">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kids Arcade">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <title>Maze</title>
  <link rel="stylesheet" href="../css/style.css?v=202611270939">
  <!-- (Nov 24, plan point 9: start fetching the two menu fonts right away, not after the big scripts;
       only from a web address: a page opened from the disk can't preload fonts) -->
  <script>if (/^http/.test(location.protocol)) for (const f of ['LilitaOne', 'Fredoka-600']) document.write('<link rel="preload" href="../arcade/fonts/' + f + '.woff2" as="font" type="font/woff2" crossorigin>');</script>
  <style>
    body { display: flex; flex-direction: column; height: 100dvh; }

    /* Top bar: home on the left, "new maze" on the right */
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
    }

    /* The maze takes all the space it can, always a square */
    .stage {
      flex: 1;
      min-height: 0;
      display: grid;
      place-items: center;
      padding: 0 16px 16px;
      container-type: size;
    }
    #maze {
      width: min(100cqw, 100cqh);
      height: min(100cqw, 100cqh);
      touch-action: none;        /* dragging moves the character, not the page */
      overflow: visible;
    }

    /* Maze drawing */
    .shape    { stroke: var(--ink); stroke-width: 1.4; stroke-linejoin: round; }
    .path-out { fill: none; stroke: var(--ink); stroke-linecap: round; stroke-linejoin: round; }
    .path-in  { fill: none; stroke: #fff;       stroke-linecap: round; stroke-linejoin: round; }
    .trail    { fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: 0.85; }

    /* The character slides smoothly from spot to spot */
    #hero { transition: transform 0.12s ease-out; cursor: grab; }
    #hero.wiggle-me > .anim { animation: hint 1.6s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes hint { 0%, 70%, 100% { transform: scale(1); } 80% { transform: scale(1.18); } 90% { transform: scale(0.95); } }
    #goal > .anim { animation: bob 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    /* the cheeky treat (Nov 22): it giggles and hops away along the paths when you come close */
    #goal.cheeky { transition: transform 0.55s cubic-bezier(.3, 1.4, .5, 1); }
    #goal.cheeky > .anim { animation: cheeky 0.7s ease-in-out infinite; }
    @keyframes cheeky { 25% { transform: translateY(-8%) rotate(-12deg); } 75% { transform: translateY(-8%) rotate(12deg); } }
    #goal.hopping > .anim { animation: hop 0.55s ease-in-out 1; transform-origin: bottom; }
    .puff { fill: #fff; stroke: var(--ink); animation: puff 0.7s ease-out forwards; transform-box: fill-box; transform-origin: center; }
    @keyframes puff { from { transform: scale(0.4); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }
    @keyframes bob { 50% { transform: translateY(-6%) rotate(6deg); } }

    /* Winning: the character hops, stars fly out */
    #hero.happy > .anim { animation: hop 0.5s ease-in-out 3; transform-box: fill-box; transform-origin: bottom; }
    @keyframes hop { 50% { transform: translateY(-30%) scale(1.15); } }
    .burst { animation: fly 1.1s ease-out forwards; transform-box: fill-box; transform-origin: center; }
    @keyframes fly {
      from { transform: translate(0, 0) scale(0.3) rotate(0deg); opacity: 1; }
      to   { transform: translate(var(--dx), var(--dy)) scale(1.2) rotate(200deg); opacity: 0; }
    }

    .top .mid { display: flex; gap: 12px; }
    /* small phones upright (Nov 20): 4 round buttons in a row didn't fit (Nov 22: 5 now, so up to 480 wide) */
    @media (max-width: 480px) {
      .top { padding: 8px 4px; }
      .top .round-btn { width: 60px; height: 60px; } .top .round-btn svg { width: 36px; height: 36px; }
      .top .mid { gap: 6px; }
    }
    /* 5 round buttons in a row on the smallest phones (the music button joined, Nov 22) */
    @media (max-width: 360px) {
      .top .round-btn { width: 54px; height: 54px; } .top .round-btn svg { width: 32px; height: 32px; }
      .top .mid { gap: 4px; }
    }
    #musicBtn.music-on { background: #fff4c7; }
    body { transition: background 0.4s; }
    /* key and gems gently bob */
    .bob > .anim { animation: bob 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .door { transition: opacity 0.6s; }
    /* in a tunnel under a bridge (Nov 22): your friend peeks out, a bit see-through */
    #hero > .anim { transition: opacity 0.15s, transform 0.15s; transform-box: fill-box; transform-origin: center; }
    #hero.under > .anim { opacity: 0.55; transform: scale(0.8); }
    /* the "show me" path: a sparkly dashed line */
    .hint { fill: none; stroke: #ffd166; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 0.1 3.2;
            animation: hintmove 0.6s linear infinite; filter: drop-shadow(0 0 1.2px #fff); }
    @keyframes hintmove { to { stroke-dashoffset: -3.3; } }
    /* stars earned, shown above the next arrow */
    .winstars { position: fixed; left: 50%; bottom: calc(8vh + 130px); transform: translateX(-50%); display: none; gap: 8px; z-index: 5; }
    .winstars.show { display: flex; }
    .winstars svg { width: 64px; height: 64px; }
    .winstars svg.on { animation: starpop 0.5s cubic-bezier(.3, 1.8, .5, 1) both; }
    .winstars svg.medal { width: 80px; height: 80px; }
    @keyframes starpop { from { transform: scale(0) rotate(-90deg); } }

    /* Big "next maze" arrow that appears after a win */
    #next {
      position: fixed;
      left: 50%; bottom: 8vh;
      width: 120px; height: 120px;
      margin-left: -60px;
      border-radius: 50%;
      background: #06d6a0;
      display: none;
      animation: pulse 1s ease-in-out infinite;
    }
    #next svg { width: 70px; height: 70px; }
    #next.show { display: grid; }
    @keyframes pulse { 50% { transform: scale(1.1); } }
    /* "stuck?" nudge: the bulb wiggles */
    #hint.nudge { animation: nudge 0.9s ease-in-out 3; }
    @keyframes nudge { 25% { transform: rotate(-12deg) scale(1.1); } 75% { transform: rotate(12deg) scale(1.1); } }
    /* dark caves */
    .fog { fill: #1b1630; opacity: 0.9; pointer-events: none; }
    #goal.glow > .anim { filter: drop-shadow(0 0 2px #ffe58a) drop-shadow(0 0 4px #ffe58a); }
    .winstars svg.newfriend { width: 84px; height: 84px; }

    /* The map is a canvas menu now (Phaser + Rex UI, arcade/canvasmenu.js; Nov 21) */


    /* ---- The Maze Maker (Nov 22): dig your own maze ---- */
    #makerBar { display: none; }
    #editBtn { display: none; }
    body.playmine #shuffle { display: none; }
    body.playmine #editBtn { display: grid; }
    body.making .top { display: none; }
    body.making #makerBar { display: flex; flex-direction: column; gap: 10px; align-items: center; padding: 0 8px 12px; }
    body.making .stage { padding-top: 12px; }
    .mk-row { display: flex; gap: min(10px, 1.6vw); justify-content: center; }
    /* buttons: as big as fit (13% of the width upright, 13% of the height sideways), never more than 72px */
    #makerBar .round-btn { --mk: min(72px, 13vw, 13vh); width: var(--mk); height: var(--mk); border-width: 4px; }
    #makerBar .round-btn svg { width: 62%; height: 62%; }
    #makerBar .round-btn.on { background: #ffd166; }
    #makerBar .round-btn.dim { opacity: 0.45; }
    #mk-play { background: #06d6a0; }
    #mk-play.ready svg { animation: pulse 1s ease-in-out infinite; }   /* (the picture pulses, never the button: taps near its edge must work) */
    /* sideways: the maze on the left, the buttons in two columns on the right */
    @media (orientation: landscape) {
      body.making { flex-direction: row; }
      body.making .stage { padding: 12px 8px 12px 16px; }
      body.making #makerBar { flex-direction: row; padding: 12px 12px 12px 0; align-items: stretch; }
      body.making .mk-row { flex-direction: column; justify-content: center; }
    }
    .spot { fill: #fff; stroke: var(--ink); opacity: 0.55; }
    .mk-wiggle { animation: nudge 0.5s ease-in-out 1; }

    /* phones: use 90% of the screen, a 5% border all round (Keith) */
    html.ar-phone body { padding: 5vh 5vw; }
  </style>
</head>
<body>
  <div class="top">
    <a class="round-btn" href="../index.html" aria-label="Home">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <path d="M6 24 L24 8 L42 24 M12 20 V40 H36 V20" fill="none" stroke="#2b2b2b"
              stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="20" y="28" width="8" height="12" fill="#ef476f"/>
      </svg>
    </a>
    <div class="mid">
      <button class="round-btn" id="hint" aria-label="Show me the way">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <!-- a light bulb -->
          <path d="M24 6 C14 6 9 13 9 20 C9 27 15 30 16 36 H32 C33 30 39 27 39 20 C39 13 34 6 24 6 Z" fill="#ffd166" stroke="#2b2b2b" stroke-width="4" stroke-linejoin="round"/>
          <path d="M18 41 H30" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round"/>
          <path d="M20 22 Q24 17 28 22" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </button>
      <button class="round-btn" id="mapBtn" aria-label="Map: friends and all mazes">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <!-- a folded treasure map with a dotted path -->
          <path d="M5 11 L17 6 L31 11 L43 6 V37 L31 42 L17 37 L5 42 Z" fill="#fff1c1" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round"/>
          <path d="M17 6 V37 M31 11 V42" stroke="#2b2b2b" stroke-width="2.5"/>
          <path d="M10 33 Q16 22 24 26 T37 15" fill="none" stroke="#ef476f" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 5"/>
          <path d="M33 11 L41 19 M41 11 L33 19" stroke="#ef476f" stroke-width="3.5" stroke-linecap="round"/>
        </svg>
      </button>
      <!-- music on/off (off until tapped; the note is drawn by Arcade.pageMusic in shared.js) -->
      <button class="round-btn" id="musicBtn" aria-label="Music"></button>
    </div>
    <button class="round-btn" id="shuffle" aria-label="A different maze">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <!-- circling arrow = "another one" -->
        <path d="M38 24 A14 14 0 1 1 30 11" fill="none" stroke="#2b2b2b" stroke-width="5"
              stroke-linecap="round"/>
        <path d="M24 6 L33 11 L26 19" fill="none" stroke="#2b2b2b" stroke-width="5"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <!-- playing your own maze (the Maze Maker): back to digging -->
    <button class="round-btn" id="editBtn" aria-label="Change my maze">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <!-- a pencil -->
        <path d="M10 38 L13 28 L32 9 L39 16 L20 35 Z" fill="#ffd166" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round"/>
        <path d="M28 13 L35 20" stroke="#2b2b2b" stroke-width="3.5"/>
        <path d="M10 38 L13 28 L20 35 Z" fill="#f4c99b" stroke="#2b2b2b" stroke-width="3" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <div class="stage">
    <svg id="maze" viewBox="-4 -4 108 108" role="img" aria-label="Maze"></svg>
  </div>

  <!-- The Maze Maker's buttons (drawn by maze.js): tools on one row, the rest on the other -->
  <div id="makerBar">
    <div class="mk-row" id="mkTools"></div>
    <div class="mk-row" id="mkActions"></div>
  </div>

  <button class="round-btn" id="next" aria-label="Next maze">
    <svg viewBox="0 0 48 48" aria-hidden="true">
      <path d="M18 8 L34 24 L18 40" fill="none" stroke="#2b2b2b" stroke-width="7"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <div id="winStars" class="winstars"></div>

  <script src="../arcade/gsap.min.js?v=202611270939"></script>  <!-- GSAP: bouncy menu animations (arcade/LIBRARIES.md) -->
  <script src="../arcade/shared.js?v=202611270939"></script> <!-- only for saving progress to the arcade -->
  <script src="../arcade/stickers.js?v=202611270939"></script>  <!-- the sticker book -->
  <script src="../arcade/daily.js?v=202611270939"></script>  <!-- the daily surprise -->
  <script src="../arcade/parent.js?v=202611270939"></script>  <!-- play time + time limit (the Parent corner) -->
  <script src="../arcade/phaser.min.js?v=202611270939"></script>  <!-- Phaser 3: draws the map menu -->
  <script src="../arcade/rexui.min.js?v=202611270939"></script>  <!-- Rex UI: buttons, grids and scrolling panels for Phaser -->
  <script src="../arcade/canvasmenu.js?v=202611270939"></script>  <!-- the menus, drawn by Phaser (arcade/canvasmenu.js) -->
  <script src="maze.js?v=202611270939"></script>
</body>
</html>
